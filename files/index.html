function todayStr() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function diffDays(a, b) { if (!a) return 0; const da = new Date(a + "T00:00:00"), db = new Date(b + "T00:00:00"); return Math.round((db - da) / 86400000); }
function addDays(a, n) { const d = new Date(a + "T00:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function lastNDates(n) {
  const out = []; const now = new Date();
  for (let i = n - 1; i >= 0; i--) { const d = new Date(now); d.setDate(d.getDate() - i); out.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0")); }
  return out;
}
function bestWeekPct(dayLog) {
  if (!dayLog.length) return 0;
  let best = 0;
  for (let i = 0; i < dayLog.length; i++) {
    const w = dayLog.slice(Math.max(0, i - 6), i + 1);
    const sum = w.reduce((a, d) => a + (d.total ? d.done / d.total : 0), 0);
    best = Math.max(best, sum / w.length);
  }
  return Math.round(best * 100);
}

const STAGE_THRESH = [0, 25, 75, 150, 300, 500];
function stageFor(totalDone) { let s = 1; for (let i = 0; i < STAGE_THRESH.length; i++) if (totalDone >= STAGE_THRESH[i]) s = i + 1; return s; }
function nextStageInfo(totalDone) {
  const stage = stageFor(totalDone);
  const min = STAGE_THRESH[stage - 1];
  const next = STAGE_THRESH[stage];
  const progress = next != null ? Math.min(1, (totalDone - min) / (next - min)) : 1;
  return { stage, next, progress };
}
function resolveEquipped(equipped) {

/* ---- day-close reducer: the ONLY place a day advances, driven by the real clock ---- */
function closeDay(s, dateStr) {
  const done = s.habits.filter((h) => h.doneToday).length;
  const total = s.habits.length;
  const streak = done > 0 ? s.streak + 1 : 0;
  const bestStreakEver = Math.max(s.bestStreakEver, streak);
  const dayLog = [...s.dayLog, { date: dateStr, done, total }].slice(-120);
  const habits = s.habits.map((h) => {
    const hs = h.doneToday ? h.streak : 0;
    return { ...h, streak: hs, best: Math.max(h.best || 0, hs), log: h.doneToday ? [...(h.log || []), dateStr].slice(-60) : (h.log || []), doneToday: false };
  });
  let price = s.stock.price;
  if (total > 0) { if (done === total) price *= 1.01; else if (done === 0) price *= 0.97; }
  price = Math.round(price * 100) / 100;
  const stock = { ...s.stock, price, history: [...s.stock.history, { date: dateStr, price }].slice(-180) };
  const state = { ...s, streak, bestStreakEver, dayLog, habits, stock, lastDate: dateStr };
  const info = { date: dateStr, done, total, streakBroken: done === 0, price };
  return { state, info };
}
function rollForward(s) {
  let cur = s, info = null, days = 0;
  const el = Math.min(diffDays(s.lastDate, todayStr()), 60);
  for (let i = 0; i < el; i++) {
    const r = closeDay(cur, addDays(s.lastDate, i + 1));
    cur = r.state; info = r.info; days++;
  }
  return { state: cur, info, days };
}
function hydrate(saved) {

function assetSeries(asset) {

  const pts = [{ v: running }];
  asset.history.forEach((h) => { running += h.delta; pts.push({ v: running }); });
  return pts;
}

/* ---------- small shared components ---------- */
function useTilt(max = 10) {
  const [t, setT] = useState({ x: 0, y: 0 });
  const ref = useRef(null);
  const move = useCallback((e) => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    setT({ x: ((p.clientX - r.left) / r.width - 0.5) * 2, y: ((p.clientY - r.top) / r.height - 0.5) * 2 });
  }, []);
  const reset = useCallback(() => setT({ x: 0, y: 0 }), []);
  return { t, max, ref, handlers: { onPointerMove: move, onPointerLeave: reset, onTouchMove: move, onTouchEnd: reset } };
}
function useCount(value, decimals = 0) {
  const [d, setD] = useState(value); const ref = useRef(value);
  useEffect(() => {
    const from = ref.current, to = value; if (from === to) return;
    const mul = Math.pow(10, decimals);
    const start = performance.now(); let raf;
    const tick = (now) => { const p = Math.min(1, (now - start) / 480); const e = 1 - Math.pow(1 - p, 3);
      setD(Math.round((from + (to - from) * e) * mul) / mul); if (p < 1) raf = requestAnimationFrame(tick); else ref.current = to; };
    raf = requestAnimationFrame(tick); return () => cancelAnimationFrame(raf);
  }, [value, decimals]);
  return d;
}
function usePriceFlash(price) {
  const [flash, setFlash] = useState(null);
  const prevRef = useRef(price);
  useEffect(() => {
    const prev = prevRef.current;
    if (price !== prev) {
      prevRef.current = price;
      setFlash(price > prev ? "up" : "down");
      const t = setTimeout(() => setFlash(null), 550);
      return () => clearTimeout(t);
    }
  }, [price]);

}

function TrendLine({ points, height = 70, color }) {
  const { accent } = useAccent();
  const col = color || accent;
  if (points.length < 2) return <div style={{ height }} className="flex items-center justify-center"><span className="text-[11px]" style={{ color: C.soft, fontFamily: MONO }}>Log a few entries to see your trend</span></div>;
  const vals = points.map((p) => p.v);
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const w = 300, n = points.length, stepX = w / (n - 1);
  const xy = points.map((p, i) => [i * stepX, height - ((p.v - min) / span) * height * 0.82 - height * 0.09]);
  const path = xy.map((p, i) => (i === 0 ? "M" : " L") + p[0] + " " + p[1]).join("");
  const last = xy[xy.length - 1];
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" style={{ overflow: "visible" }}>
      <defs><linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={col} stopOpacity="0.3" /><stop offset="1" stopColor={col} stopOpacity="0" /></linearGradient></defs>
      <path d={`${path} L${last[0]} ${height} L0 ${height} Z`} fill="url(#trendFill)" stroke="none" />
      <path d={path} fill="none" stroke={col} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={last[0]} cy={last[1]} r="4" fill={col} />
    </svg>
  );
}

function StockChart({ data, up, height = 64 }) {

  if (known.length < 2) return <div style={{ height }} className="flex items-center justify-center"><span className="text-[11px]" style={{ color: C.soft, fontFamily: MONO }}>Price history builds as you go</span></div>;
  const vals = data.map((d) => d.v);
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const w = 300, n = data.length, stepX = w / (n - 1);
  const xy = data.map((d, i) => [i * stepX, height - ((d.v - min) / span) * height * 0.82 - height * 0.09]);
  const path = xy.map((p, i) => (i === 0 ? "M" : " L") + p[0] + " " + p[1]).join("");
  const last = xy[xy.length - 1];
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" style={{ overflow: "visible" }}>
      <defs><linearGradient id="stockFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={color} stopOpacity="0.32" /><stop offset="1" stopColor={color} stopOpacity="0" /></linearGradient></defs>
      <path d={`${path} L${last[0]} ${height} L0 ${height} Z`} fill="url(#stockFill)" stroke="none" />
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={last[0]} cy={last[1]} r="4" fill={color} />
    </svg>
  );
}

function Terra() {
  const raw = useMemo(load, []);

  const [rolloverInfo, setRolloverInfo] = useState(null);
  const [tab, setTab] = useState("today");

  const [booting, setBooting] = useState(true);
  const stateRef = useRef(S);
  useEffect(() => { stateRef.current = S; }, [S]);

  useEffect(() => {
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const t = setTimeout(() => setBooting(false), reduced ? 0 : 780);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    if (!raw.lastDate) return;
    const { state, info, days } = rollForward(hydrate(raw));
    if (days > 0) { setS(state); setRolloverInfo({ ...info, multi: days > 1, days }); }
  }, []);

  useEffect(() => {
    const id = setInterval(() => {
      const s = stateRef.current;
      if (diffDays(s.lastDate, todayStr()) > 0) {
        const { state, info, days } = rollForward(s);
        setS(state);
        if (info) setRolloverInfo({ ...info, multi: days > 1, days });
      }
    }, 45000);
    return () => clearInterval(id);
  }, []);

  useEffect(() => { save(S); }, [S]);

  const done = S.habits.filter((h) => h.doneToday).length;
  const total = S.habits.length;
  const energy = total ? done / total : 0;
  const shownCash = useCount(Math.round(S.cash));
  const activeTheme = THEMES.find((t) => t.id === S.theme) || THEMES[0];
  const totalDone = S.habits.reduce((s, h) => s + h.total, 0);

  function complete(id) {
    setS((s) => {
      const h = s.habits.find((x) => x.id === id);
      if (!h || h.doneToday) return s;
      const gain = reward(h.base, h.streak, h.difficulty);
      const bump = priceBumpPct(h);
      const newPrice = Math.round(s.stock.price * (1 + bump) * 100) / 100;
      return { ...s, cash: s.cash + gain, stock: { ...s.stock, price: newPrice },
        habits: s.habits.map((x) => x.id === id ? { ...x, doneToday: true, streak: x.streak + 1, total: x.total + 1 } : x) };
    });
    setCompleteTick((t) => t + 1);
  }
  function removeHabit(id) { setS((s) => ({ ...s, habits: s.habits.filter((h) => h.id !== id) })); }
  function addHabit(name, emoji) {
    if (!name.trim()) return;
    setS((s) => ({ ...s, habits: [...s.habits, { id: Date.now(), name: name.trim(), emoji, base: 15, difficulty: "standard", streak: 0, best: 0, total: 0, doneToday: false, log: [] }] }));
  }
  function updateHabit(id, patch) { setS((s) => ({ ...s, habits: s.habits.map((h) => h.id === id ? { ...h, ...patch } : h) })); }
  function moveHabit(id, dir) {
    setS((s) => {
      const i = s.habits.findIndex((h) => h.id === id); const j = i + dir;
      if (i < 0 || j < 0 || j >= s.habits.length) return s;
      const next = [...s.habits]; [next[i], next[j]] = [next[j], next[i]];
      return { ...s, habits: next };
    });
  }
  function setJournalNote(text) { setS((s) => ({ ...s, journal: { ...s.journal, [s.lastDate]: text } })); }

          <div style={lbl}>{TABS[tabIndex][1]}</div>

            onComplete={complete} onRemove={removeHabit} onAdd={addHabit} onUpdateHabit={updateHabit} onMoveHabit={moveHabit}
            journalNote={S.journal[S.lastDate] || ""} onJournal={setJournalNote} />}
          {tab === "assets" && <Assets S={S} onAddAsset={addAsset} onRemoveAsset={removeAsset} onLog={logEntry} />}
          {tab === "market" && <Market S={S} onBuyShares={buyShares} onSellShares={sellShares} />}
          {tab === "character" && <Character S={S} totalDone={totalDone} onBuyItem={buyItem} onEquipItem={equipItem} />}

function RolloverToast({ info, onDismiss }) {
  const [show, setShow] = useState(false);
  useEffect(() => { const id = requestAnimationFrame(() => setShow(true)); return () => cancelAnimationFrame(id); }, []);
  function dismiss() { setShow(false); setTimeout(onDismiss, 220); }
  useEffect(() => { const id = setTimeout(dismiss, 6000); return () => clearTimeout(id); }, []);
  const priceLine = ` ISWR closed $${info.price.toFixed(2)}.`;
  const msg = (info.multi
    ? `Welcome back — ${info.days} day${info.days === 1 ? "" : "s"} passed while you were away.`
    : info.streakBroken ? "Streak reset — yesterday went untended."
    : `Yesterday: ${info.done}/${info.total} tended.`) + priceLine;
  return (
    <div onClick={dismiss} className="mb-2 px-4 py-3 rounded-2xl flex items-center gap-2.5 active:scale-[0.98] press" style={{ background: C.surf2, border: `1px solid ${C.line}`, transform: show ? "translateY(0)" : "translateY(-16px)", opacity: show ? 1 : 0, transition: "transform .3s var(--snap), opacity .24s var(--snap)" }}>
      <span className="text-[16px]">{info.streakBroken ? "💤" : "🔔"}</span>
      <span className="text-[12.5px] flex-1" style={{ color: C.ink }}>{msg}</span>
    </div>
  );
}

function AssetDetail({ asset, onClose, onLog, onDelete }) {
  const { accent } = useAccent();
  const { show, close } = useSheetExit(onClose);
  const [amt, setAmt] = useState("");
  const [note, setNote] = useState("");
  const [sign, setSign] = useState(1);
  const [flash, setFlash] = useState(null);
  const [flyNum, setFlyNum] = useState(null);
  const [invalid, setInvalid] = useState(false);
  const shown = useCount(asset.value);
  const series = useMemo(() => assetSeries(asset), [asset.history, asset.value]);
  function submit() {
    const n = Math.abs(Number(amt));
    if (!n) { setInvalid(true); setTimeout(() => setInvalid(false), 420); return; }
    const delta = sign * n;
    onLog(asset.id, delta, note.trim());
    setFlash(sign > 0 ? "up" : "down");
    setFlyNum({ v: delta, key: Date.now() });
    setTimeout(() => setFlash(null), 900);
    setTimeout(() => setFlyNum(null), 900);
    setAmt(""); setNote("");
  }
  return (
    <div className="absolute inset-0 z-30 flex items-end justify-center" style={{ background: `rgba(0,0,0,${show ? 0.6 : 0})`, transition: "background .22s var(--snap)" }} onClick={() => close()}>
      <div className="w-full rounded-t-[32px] p-5" style={{ background: C.surf, border: `1px solid ${C.line}`, borderBottom: "none", maxHeight: "85vh", overflowY: "auto", transform: show ? "translateY(0)" : "translateY(28px)", opacity: show ? 1 : 0, transition: "transform .28s var(--snap), opacity .22s var(--snap)" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center gap-3 mb-4">
          <div className="flex items-center justify-center rounded-2xl text-2xl" style={{ width: 52, height: 52, background: C.surf2 }}>{asset.emoji}</div>
          <div className="flex-1 text-[17px] font-semibold" style={{ color: C.ink }}>{asset.name}</div>
          <button onClick={() => close(() => onDelete(asset.id))} className="p-1.5" style={{ color: C.ember }}><Trash2 size={16} /></button>
          <button onClick={() => close()} style={{ color: C.soft }}><X size={18} /></button>
        </div>

        <div className="relative rounded-[24px] p-5 mb-4 text-center overflow-hidden" style={{ background: C.surf2, border: `1px solid ${flash === "up" ? C.good : flash === "down" ? C.ember : C.line}`, transition: "border-color .3s" }}>
          <div className="text-4xl font-black" style={{ color: C.ink, fontFamily: DISPLAY }}>{asset.prefix}{shown.toLocaleString()}</div>
          {flyNum && <div key={flyNum.key} className="absolute left-1/2 font-extrabold text-[15px] pointer-events-none" style={{ top: 8, transform: "translateX(-50%)", color: flyNum.v > 0 ? C.good : C.ember, animation: "flyup .9s ease-out forwards" }}>{(flyNum.v > 0 ? "+" : "-") + asset.prefix + Math.abs(flyNum.v).toLocaleString()}</div>}
        </div>

        <div className="mb-4"><TrendLine points={series} /></div>

        <div className="flex gap-2 mb-2">
          <button onClick={() => setSign(1)} className="w-11 rounded-xl font-bold text-[18px] hoverLift press" style={{ background: sign === 1 ? C.good : C.surf2, color: sign === 1 ? C.app : C.soft }}>+</button>
          <button onClick={() => setSign(-1)} className="w-11 rounded-xl font-bold text-[18px] hoverLift press" style={{ background: sign === -1 ? C.ember : C.surf2, color: sign === -1 ? C.app : C.soft }}>−</button>
          <input type="number" value={amt} onChange={(e) => setAmt(e.target.value)} placeholder="Amount" className={"flex-1 px-3.5 py-2.5 rounded-xl text-[14px] outline-none focusRing" + (invalid ? " shake" : "")} style={{ background: C.surf2, color: C.ink, border: `1px solid ${invalid ? C.ember : C.line}` }} />
        </div>
        <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="Note (optional)" className="w-full px-3.5 py-2.5 rounded-xl text-[13px] outline-none mb-2 focusRing" style={{ background: C.surf2, color: C.ink, border: `1px solid ${C.line}` }} />
        <button onClick={submit} className="w-full py-3 rounded-xl font-bold text-[13px] uppercase hoverLift press" style={{ background: accent, color: C.app, fontFamily: MONO }}>Log entry</button>
        <div className="text-[10px] text-center mt-2" style={{ color: invalid ? C.ember : C.soft, fontFamily: MONO }}>{invalid ? "Enter an amount first" : "Gains lift ISWR, losses dip it — just like a day tended"}</div>

        {asset.history.length > 0 && <>
          <div style={lbl} className="mt-5 mb-2">History</div>
          <div className="flex flex-col gap-1.5">
            {[...asset.history].reverse().slice(0, 20).map((h) => (
              <div key={h.id} className="flex items-center justify-between px-3.5 py-2.5 rounded-xl" style={{ background: C.surf2, border: `1px solid ${C.line}` }}>
                <div className="min-w-0">
                  <div className="text-[10px] uppercase" style={{ color: C.soft, fontFamily: MONO }}>{h.date}</div>
                  {h.note && <div className="text-[12px] truncate" style={{ color: C.ink }}>{h.note}</div>}
                </div>
                <div className="font-bold text-[13px]" style={{ color: h.delta > 0 ? C.good : C.ember, fontFamily: MONO }}>{(h.delta > 0 ? "+" : "-") + asset.prefix + Math.abs(h.delta).toLocaleString()}</div>
              </div>
            ))}
          </div>
        </>}
        <div style={{ height: "env(safe-area-inset-bottom)", paddingTop: 12 }} />
      </div>
    </div>
  );
}
function Assets({ S, onAddAsset, onRemoveAsset, onLog }) {
  const { accent } = useAccent();
  const [adding, setAdding] = useState(false);
  const [openAsset, setOpenAsset] = useState(null);
  const live = openAsset ? S.assets.find((a) => a.id === openAsset.id) : null;
  return (
    <div className="px-4 pb-6 pt-2">
      <div className="px-2 mb-4">
        <div className="text-[25px] font-extrabold" style={{ color: C.ink, fontFamily: DISPLAY, letterSpacing: "-0.02em" }}>Assets</div>
        <div className="text-[13px] mt-0.5" style={{ color: C.soft }}>Track anything that compounds — every gain feeds ISWR too.</div>
      </div>
      {adding && <AddAssetRow onAdd={(n, e, p) => { onAddAsset(n, e, p); setAdding(false); }} onCancel={() => setAdding(false)} />}
      {S.assets.length === 0 ? (
        <EmptyState icon="📊" title="Nothing tracked yet" body="Add a tracker for anything that compounds — savings, weight, debt." />
      ) : (
        <div className="flex flex-col gap-2 mb-3">
          {S.assets.map((a, i) => (
            <div key={a.id} className="rowIn" style={{ animationDelay: `${Math.min(i, 6) * 40}ms` }}>
              <AssetCard asset={a} onOpen={() => setOpenAsset(a)} />
            </div>
          ))}
        </div>
      )}
      <button onClick={() => setAdding(true)} className="w-full py-3 rounded-2xl flex items-center justify-center gap-1.5 font-bold text-[13px] uppercase hoverLift press" style={{ background: C.surf, border: `1px solid ${C.line}`, color: accent, fontFamily: MONO }}><Plus size={15} /> New tracker</button>
      {live && <AssetDetail asset={live} onClose={() => setOpenAsset(null)} onLog={onLog} onDelete={(id) => { onRemoveAsset(id); setOpenAsset(null); }} />}
    </div>
  );
}

/* ================================================================== */
/*  MARKET — ISWR history chart + buy/sell, nothing else               */
/* ================================================================== */
function Market({ S, onBuyShares, onSellShares }) {
  const { accent } = useAccent();
  const [amt, setAmt] = useState(""); const [mode, setMode] = useState("buy");
  const [err, setErr] = useState(""); const [confirm, setConfirm] = useState(false);
  const price = S.stock.price, shares = S.stock.shares;
  const shownPrice = useCount(price, 2);
  const flash = usePriceFlash(price);
  const openPrice = S.stock.history.length ? S.stock.history[S.stock.history.length - 1].price : BASE_PRICE;
  const change = price - openPrice;
  const changePct = openPrice ? (change / openPrice) * 100 : 0;
  const up = change >= 0;
  const chartData = useMemo(() => {
    const hist = S.stock.history.slice(-29).map((h) => ({ v: h.price }));
    return [...hist, { v: price }];
  }, [S.stock.history, price]);
  const athPrice = Math.max(BASE_PRICE, price, ...S.stock.history.map((h) => h.price));
  const totalChangePct = ((price / BASE_PRICE) - 1) * 100;
  const portfolioValue = shares * price;
  function submit() {
    const n = Number(amt);
    if (!n || n <= 0) { setErr("Enter an amount"); setTimeout(() => setErr(""), 1600); return; }
    if (mode === "buy" && n > S.cash) { setErr(`You only have $${Math.round(S.cash)} to invest`); setTimeout(() => setErr(""), 2000); return; }
    if (mode === "sell" && n > shares) { setErr(`You only hold ${shares.toFixed(3)} shares`); setTimeout(() => setErr(""), 2000); return; }
    if (mode === "buy") onBuyShares(n); else onSellShares(n);
    setAmt(""); setConfirm(true); setTimeout(() => setConfirm(false), 900);
  }
  return (
    <div className="px-4 pb-6 pt-2">
      <div className="px-2 mb-3"><div className="text-[25px] font-extrabold" style={{ color: C.ink, fontFamily: DISPLAY, letterSpacing: "-0.02em" }}>Market</div></div>

      <div className="rounded-[28px] p-5 relative overflow-hidden mb-4" style={{ background: C.surf, border: `1px solid ${C.line}`, boxShadow: SHADOW }}>
        <div className="absolute -top-24 -right-16 rounded-full pointer-events-none" style={{ width: 220, height: 220, background: up ? C.good : C.ember, opacity: 0.14, filter: "blur(54px)" }} />
        <div className="absolute inset-0 pointer-events-none" style={{ background: flash === "up" ? "rgba(46,213,115,.10)" : flash === "down" ? "rgba(255,92,114,.10)" : "transparent", transition: "background .5s var(--quick)" }} />
        <div className="relative">
          <div className="flex items-center gap-2">
            <span className="px-2 py-0.5 rounded-md text-[11px] font-bold" style={{ background: C.surf2, color: up ? C.good : C.ember, fontFamily: MONO }}>ISWR</span>
            <span className="text-[12px]" style={{ color: C.soft }}>Iswara Capital</span>
          </div>
          <div className="text-[40px] font-black mt-1 leading-none" style={{ fontFamily: DISPLAY, color: C.ink, letterSpacing: "-0.02em" }}>{"$" + shownPrice.toFixed(2)}</div>
          <div className="flex items-center gap-1 text-[13px] font-bold mt-1" style={{ color: up ? C.good : C.ember, fontFamily: MONO }}>
            <span className={flash ? "arrowBounce" : ""} style={{ display: "inline-block" }}>{up ? "▲" : "▼"}</span>
            <span>{(up ? "+" : "") + change.toFixed(2) + " (" + (up ? "+" : "") + changePct.toFixed(1) + "%)"}</span>
            <span className="ml-1" style={{ color: C.soft, fontWeight: 500 }}>today</span>
          </div>
        </div>
        <div className="relative mt-4"><StockChart data={chartData} up={up} height={130} /></div>
        <div className="relative grid grid-cols-3 gap-2 mt-4 pt-3" style={{ borderTop: `1px solid ${C.line}` }}>
          <MiniStat label="All-time high" value={`$${athPrice.toFixed(2)}`} />
          <MiniStat label="Since IPO" value={`${totalChangePct >= 0 ? "+" : ""}${totalChangePct.toFixed(1)}%`} />
          <MiniStat label="Position" value={`$${portfolioValue.toFixed(0)}`} />
        </div>
      </div>

      <div className="p-5 rounded-[26px] mb-4 text-center relative overflow-hidden" style={{ background: `linear-gradient(135deg, ${accent}, ${accent}55)`, boxShadow: SHADOW, border: `1px solid ${C.line}` }}>
        {confirm && <div className="absolute inset-0 flex items-center justify-center confirmFlash" style={{ background: "rgba(255,255,255,.22)" }}><Check size={28} color={C.app} strokeWidth={3} /></div>}
        <div className="text-[11px] font-semibold tracking-wide uppercase relative" style={{ color: "rgba(10,10,15,.7)", fontFamily: MONO }}>Your Position</div>
        <div className="text-4xl font-black my-1 relative" style={{ color: C.app, letterSpacing: "-1px", fontFamily: DISPLAY }}>{"$" + portfolioValue.toFixed(2)}</div>
        <div className="text-[12px] relative" style={{ color: "rgba(10,10,15,.75)", fontFamily: MONO }}>{shares.toFixed(3)} shares @ {"$" + price.toFixed(2)}</div>
      </div>
      <div className="flex gap-2 mb-3">
        <button onClick={() => { setMode("buy"); setErr(""); }} className="flex-1 py-2 rounded-xl text-[12.5px] font-bold uppercase hoverLift press" style={{ background: mode === "buy" ? C.good : C.surf2, color: mode === "buy" ? C.app : C.soft, fontFamily: MONO }}>Buy</button>
        <button onClick={() => { setMode("sell"); setErr(""); }} disabled={shares <= 0} className="flex-1 py-2 rounded-xl text-[12.5px] font-bold uppercase hoverLift press" style={{ background: mode === "sell" ? C.ember : C.surf2, color: shares <= 0 ? "#4A4A55" : mode === "sell" ? C.app : C.soft, fontFamily: MONO }}>Sell</button>
      </div>
      <div className="flex gap-2 mb-1.5">
        <input type="number" value={amt} onChange={(e) => setAmt(e.target.value)} placeholder={mode === "buy" ? `Cash to invest (have $${Math.round(S.cash)})` : `Shares to sell (have ${shares.toFixed(3)})`} className={"flex-1 px-3.5 py-2.5 rounded-xl text-[14px] outline-none focusRing" + (err ? " shake" : "")} style={{ background: C.surf2, color: C.ink, border: `1px solid ${err ? C.ember : C.line}` }} />
        <button onClick={submit} className="px-4 rounded-xl font-bold text-[13px] uppercase hoverLift press" style={{ background: accent, color: C.app, fontFamily: MONO }}>{mode === "buy" ? "Buy" : "Sell"}</button>
      </div>
      <div className="text-[11px] text-center" style={{ color: err ? C.ember : C.soft, fontFamily: MONO }}>{err || (mode === "buy" ? `≈ ${(Number(amt || 0) / price).toFixed(3)} shares at $${price.toFixed(2)}` : `≈ $${(Number(amt || 0) * price).toFixed(2)} at $${price.toFixed(2)}/share`)}</div>
    </div>
  );
}

/* ================================================================== */
/*  CHARACTER — outfit, gear, garage, property                        */
/* ================================================================== */
function SlotSection({ slot, S, onBuy, onEquip }) {
  const { accent } = useAccent();
  const items = ITEMS.filter((i) => i.slot === slot);
  return (
    <div className="px-4 mb-5">
      <div style={lbl} className="mb-2 px-1">{SLOT_LABELS[slot]}</div>
      <div className="grid grid-cols-3 gap-2">
        <button onClick={() => onEquip(slot, null)} className="p-3 rounded-[18px] flex flex-col items-center" style={{ background: C.surf, border: `1px solid ${!S.equipped[slot] ? accent : C.line}` }}>
          <div className="text-xl mb-1" style={{ color: C.soft }}>—</div>
          <div className="text-[10px] font-bold uppercase" style={{ color: C.soft, fontFamily: MONO }}>None</div>
        </button>
        {items.map((item) => {
          const owned = S.itemsOwned.includes(item.id);
          const isEquipped = S.equipped[slot] === item.id;
          const afford = S.cash >= item.price;
          const icon = item.c1 ? <div className="rounded-full" style={{ width: 22, height: 22, background: `linear-gradient(135deg, ${item.c1}, ${item.c2})` }} /> : <span className="text-xl">{item.emoji || (item.style === "halo" ? "⭕" : item.style === "flame" ? "🔥" : "✨")}</span>;
          return (
            <div key={item.id} className="p-3 rounded-[18px] flex flex-col items-center text-center" style={{ background: C.surf, border: `1px solid ${isEquipped ? accent : C.line}`, boxShadow: SHADOW }}>
              <div className="mb-1.5 h-[22px] flex items-center justify-center">{icon}</div>
              <div className="text-[10px] font-semibold mb-1.5 truncate w-full" style={{ color: C.ink }}>{item.name}</div>
              {owned ? (
                <button onClick={() => onEquip(slot, item.id)} className="w-full py-1 rounded-lg text-[10px] font-bold" style={{ background: isEquipped ? accent : C.surf2, color: isEquipped ? C.app : C.soft }}>{isEquipped ? "On" : "Equip"}</button>
              ) : (
                <button onClick={() => onBuy(item)} disabled={!afford} className="w-full py-1 rounded-lg text-[10px] font-bold" style={{ background: afford ? accent : C.surf2, color: afford ? C.app : "#4A4A55", fontFamily: MONO }}>{"$" + item.price.toLocaleString()}</button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}
function Character({ S, totalDone, onBuyItem, onEquipItem }) {
  const { accent, accent2 } = useAccent();
  const { stage, next, progress } = nextStageInfo(totalDone);
  const [pulse, setPulse] = useState(false);
  function act(fn) { fn(); setPulse(true); setTimeout(() => setPulse(false), 500); }
  return (
    <div className="pb-6 pt-2">
      <div className="px-6 mb-3">
        <div className="text-[25px] font-extrabold" style={{ color: C.ink, fontFamily: DISPLAY, letterSpacing: "-0.02em" }}>Character</div>
        <div className="text-[13px] mt-0.5" style={{ color: C.soft }}>Gear up, garage up, move up. Drag to spin.</div>
      </div>
      <CharacterScene S={S} stage={stage} pulse={pulse} />
      <div className="mx-4 mt-4 mb-5">
        <div className="flex items-center justify-between mb-1">
          <span className="text-[14px] font-extrabold" style={{ fontFamily: DISPLAY, color: C.ink }}>Level {stage}</span>
          <span className="text-[11px]" style={{ color: C.soft, fontFamily: MONO }}>{S.itemsOwned.length} items owned</span>
        </div>
        <div className="h-1.5 rounded-full overflow-hidden" style={{ background: C.surf2 }}><div className="h-full w-full origin-left" style={{ transform: `scaleX(${progress})`, transition: "transform .5s var(--snap)", background: `linear-gradient(90deg, ${accent}, ${accent2})` }} /></div>
        <div className="text-[10px] mt-1" style={{ color: C.soft, fontFamily: MONO }}>{next != null ? `${next - totalDone} reps to level up` : "Max level reached"}</div>
      </div>
      {SLOTS.map((slot) => <SlotSection key={slot} slot={slot} S={S} onBuy={(item) => act(() => onBuyItem(item))} onEquip={(slot2, id) => act(() => onEquipItem(slot2, id))} />)}
    </div>
  );
}

/* ================================================================== */
/*  PORTFOLIO                                                         */
/* ================================================================== */
function Stats({ S, energy, totalDone }) {
  const { accent } = useAccent();
  const grid = useMemo(() => {
    const cells = S.dayLog.slice(-27).map((d) => (d.total ? d.done / d.total : 0));
    while (cells.length < 27) cells.unshift(null);
    cells.push(energy);
    return cells;
  }, [S.dayLog, energy]);
  const cell = (v) => v == null ? C.surf2 : v < 0.4 ? "#2A2A3A" : v < 0.75 ? `${accent}55` : accent;
  const bestDay = S.dayLog.reduce((m, d) => Math.max(m, d.done), 0);
  const bestWeek = bestWeekPct(S.dayLog);
  const athPrice = Math.max(BASE_PRICE, S.stock.price, ...S.stock.history.map((h) => h.price));
  const totalChangePct = ((S.stock.price / BASE_PRICE) - 1) * 100;
  const portfolioValue = S.stock.shares * S.stock.price;
  const journalEntries = useMemo(() => Object.entries(S.journal || {}).filter(([, v]) => v && v.trim()).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 12), [S.journal]);

  return (
    <div className="px-4 pb-6 pt-2">
      <div className="px-2 mb-3"><div className="text-[25px] font-extrabold" style={{ color: C.ink, fontFamily: DISPLAY, letterSpacing: "-0.02em" }}>Portfolio</div></div>

      <div className="p-4 rounded-[26px] mb-4" style={{ background: C.surf, border: `1px solid ${C.line}`, boxShadow: SHADOW }}>
        <div className="flex items-center justify-between mb-2">
          <div style={lbl}>ISWR · Iswara Capital</div>
          <span className="text-[12px] font-bold" style={{ color: totalChangePct >= 0 ? C.good : C.ember, fontFamily: MONO }}>{(totalChangePct >= 0 ? "+" : "") + totalChangePct.toFixed(1) + "% since IPO"}</span>
        </div>
        <div className="grid grid-cols-3 gap-2">
          <MiniStat label="Price" value={`$${S.stock.price.toFixed(2)}`} />
          <MiniStat label="All-time high" value={`$${athPrice.toFixed(2)}`} />
          <MiniStat label="Position" value={`$${portfolioValue.toFixed(0)}`} />
        </div>
      </div>

      <div className="grid grid-cols-2 gap-2.5 mb-4">
        <Stat big={S.streak} unit="day streak" icon="🔥" tint="#FF9E4A" />
        <Stat big={`$${Math.round(portfolioValue)}`} unit="portfolio" icon="💹" tint={accent} />
        <Stat big={totalDone} unit="habits tended" icon="✓" tint={C.good} />
        <Stat big={S.assets.length} unit="assets tracked" icon="📊" tint={C.gold} />
      </div>

      <div className="p-4 rounded-[26px] mb-4" style={{ background: C.surf, border: `1px solid ${C.line}`, boxShadow: SHADOW }}>
        <div style={lbl} className="mb-3">Last 28 days</div>
        <div className="grid gap-1.5" style={{ gridTemplateColumns: "repeat(7,1fr)" }}>
          {grid.map((v, i) => <div key={i} className={i === grid.length - 1 ? "trackpulse" : ""} style={{ aspectRatio: "1", borderRadius: 8, background: cell(v), border: i === grid.length - 1 ? `2px solid ${accent}` : "none" }} />)}
        </div>
      </div>

      <div style={lbl} className="mb-2 px-1">Personal records</div>
      <div className="grid grid-cols-3 gap-2.5 mb-4">
        <MiniStat label="Best streak" value={`${S.bestStreakEver}d`} />
        <MiniStat label="Best day" value={bestDay} />
        <MiniStat label="Best week" value={`${bestWeek}%`} />
      </div>

      {journalEntries.length > 0 && <>
        <div style={lbl} className="mb-2 px-1">Log history</div>
        <div className="flex flex-col gap-2">
          {journalEntries.map(([date, text]) => (
            <div key={date} className="p-3 rounded-2xl" style={{ background: C.surf, border: `1px solid ${C.line}` }}>
              <div className="text-[10px] uppercase mb-1" style={{ color: C.soft, fontFamily: MONO, letterSpacing: "0.04em" }}>{date}</div>
              <div className="text-[13px]" style={{ color: C.ink }}>{text}</div>
            </div>
          ))}
        </div>
      </>}
    </div>
  );
}
function Stat({ big, unit, icon, tint }) {
  return (
    <div className="p-4 rounded-[22px]" style={{ background: C.surf, border: `1px solid ${C.line}`, boxShadow: SHADOW }}>
      <div className="text-[15px] mb-1">{icon}</div>
      <div className="text-[26px] font-bold leading-none" style={{ color: tint, letterSpacing: "-1px", fontFamily: MONO }}>{big}</div>
      <div className="text-[11px] mt-1 uppercase" style={{ color: C.soft, fontFamily: MONO, letterSpacing: "0.03em" }}>{unit}</div>
    </div>
  );
}

/* ================================================================== */
/*  ANIMATIONS                                                       */
/* ================================================================== */
function Style() {
  return (
    <style>{`
      .fadeup{animation:fadeUp .4s cubic-bezier(.2,.7,.2,1) both}
      @keyframes fadeUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
      @keyframes flyup{0%{opacity:0;transform:translateY(6px) scale(.8)}25%{opacity:1;transform:translateY(-4px) scale(1.2)}100%{opacity:0;transform:translateY(-30px)}}
      @keyframes sparkFly{0%{opacity:0;transform:translate(0,0) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-42px) scale(1)}}
      .spark{width:7px;height:7px;border-radius:50%;animation:sparkFly .8s ease-out forwards;position:absolute}
      @keyframes checkPop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
      .checkpop{animation:checkPop .4s ease-out}
      @keyframes trackPulse{0%,100%{box-shadow:0 0 0 0 rgba(124,92,255,.5)}50%{box-shadow:0 0 0 4px rgba(124,92,255,0)}}
      .trackpulse{animation:trackPulse 1.7s ease-in-out infinite}
      @keyframes breathe{0%,100%{transform:scaleY(1) rotate(0deg)}25%{transform:scaleY(1.014) rotate(-0.5deg)}75%{transform:scaleY(1.007) rotate(0.5deg)}}
      .breathe{animation:breathe 3.6s ease-in-out infinite}
      @keyframes charPulse{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
      .charPulse{animation:charPulse .5s cubic-bezier(.3,1.5,.4,1)}
      @keyframes compFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      .companionFloat{animation:compFloat 3s ease-in-out infinite}
      @keyframes twinkle2{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
      .twinkle2{animation:twinkle2 2.2s ease-in-out infinite}
      @keyframes wheelSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
      .wheelSpin{animation:wheelSpin 5s linear infinite}
      @keyframes carDriveIn{0%{transform:translateX(150px) scale(.92);opacity:0;filter:blur(6px)}55%{opacity:1}100%{transform:translateX(0) scale(1);opacity:1;filter:blur(0)}}
      .carDriveIn{animation:carDriveIn .85s cubic-bezier(.2,.8,.2,1) both}
      @keyframes sceneMote{0%{transform:translateY(0);opacity:0}15%{opacity:.55}88%{opacity:.25}100%{transform:translateY(-230px);opacity:0}}
      .sceneMote{animation:sceneMote linear infinite}
      @keyframes revealRing{0%{transform:scale(.3);opacity:.9}100%{transform:scale(7);opacity:0}}
      .revealRing{animation:revealRing .6s ease-out forwards}
      @keyframes revealSpark{0%{transform:rotate(var(--ang)) translateX(0) scale(1);opacity:1}100%{transform:rotate(var(--ang)) translateX(72px) scale(.4);opacity:0}}

      /* ---- motion system: press / hover / focus ---- */
      .press{transition:transform .15s var(--quick)}
      .hoverLift{transition:transform .18s var(--snap), border-color .18s var(--snap), filter .18s var(--snap)}
      @media (hover:hover){ .hoverLift:hover{transform:translateY(-2px); filter:brightness(1.06)} }
      .focusRing{transition:border-color .15s var(--quick), box-shadow .15s var(--quick)}
      .focusRing:focus{box-shadow:0 0 0 3px rgba(124,92,255,.28)}

      /* ---- validation shake ---- */
      @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
      .shake{animation:shake .42s var(--quick)}

      /* ---- list entrance stagger ---- */
      @keyframes rowIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
      .rowIn{animation:rowIn .38s var(--snap) both}

      /* ---- price ticker ---- */
      @keyframes tickFlash{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
      .tickFlash{animation:tickFlash .5s var(--quick)}
      @keyframes arrowBounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-3px)}60%{transform:translateY(1px)}}
      .arrowBounce{animation:arrowBounce .5s var(--spring)}

      /* ---- trade confirm ---- */
      @keyframes confirmFlash{0%{opacity:0;transform:scale(.7)}30%{opacity:1;transform:scale(1.1)}70%{opacity:1}100%{opacity:0;transform:scale(1)}}
      .confirmFlash{animation:confirmFlash .9s var(--snap) forwards}

      /* ---- boot sequence ---- */
      @keyframes bootScan{0%{top:-2px;opacity:0}10%{opacity:1}88%{opacity:1}100%{top:100%;opacity:0}}
      .bootScan{animation:bootScan .78s var(--soft) forwards}
      @keyframes bootFade{0%{opacity:0;filter:blur(4px)}45%{opacity:1;filter:blur(0)}75%{opacity:1}100%{opacity:0}}
      .bootFade{animation:bootFade .78s var(--snap) forwards}

      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    `}</style>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<Terra />);

</script>
</body>
