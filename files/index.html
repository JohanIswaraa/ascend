/*  PROCEDURAL AUDIO — every sound is synthesized live, zero assets    */

const Sfx = (() => {

      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(ctx.destination);

  }

    const t0 = c.currentTime + delay;

    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    const c = ac(); if (!c || muted) return;

    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0);
  }
  return {
    setMuted(m) { muted = m; if (!m) ac(); },
    isMuted: () => muted,
    tap() { tone({ freq: 460, to: 620, dur: 0.05, type: "triangle", vol: 0.05 }); },
    equip() {
      tone({ freq: 380, dur: 0.07, type: "square", vol: 0.045 });
      tone({ freq: 720, dur: 0.13, type: "triangle", vol: 0.06, delay: 0.04 });
      noise({ dur: 0.1, vol: 0.03, freq: 3200, delay: 0.02 });
    },
    purchase() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
        tone({ freq: f, dur: 0.22, type: "triangle", vol: 0.075, delay: i * 0.052 }));
      noise({ dur: 0.34, vol: 0.04, freq: 2600, delay: 0.02 });
      tone({ freq: 130, to: 90, dur: 0.3, type: "sine", vol: 0.1 });
    },
    denied() { tone({ freq: 190, to: 110, dur: 0.2, type: "square", vol: 0.07 }); },
    levelUp() {
      [392, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        tone({ freq: f, dur: 0.55, type: "sawtooth", vol: 0.055, delay: 0.12 + i * 0.085 });
        tone({ freq: f * 2, dur: 0.4, type: "sine", vol: 0.03, delay: 0.12 + i * 0.085 });
      });
      tone({ freq: 110, to: 55, dur: 1.1, type: "sine", vol: 0.2 });
      noise({ dur: 0.9, vol: 0.06, freq: 700, q: 0.7, delay: 0.05 });

/*  CANVAS PARTICLE FIELD — ambient drift + physical burst sparks      */
/* ================================================================== */

  useEffect(() => {
    const cv = ref.current; if (!cv) return;

    if (ro) ro.observe(cv);

    for (let i = 0; i < density; i++) {
      parts.current.push({ kind: "mote", x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.14, vy: -0.1 - Math.random() * 0.2,
        r: 0.5 + Math.random() * 1.5, ph: Math.random() * 6.28, life: 1 });
    }
    function frame(ts) {
      g.clearRect(0, 0, w, h);
      const arr = parts.current;
      for (let i = arr.length - 1; i >= 0; i--) {
        const p = arr[i];
        p.x += p.vx; p.y += p.vy;
        if (p.kind === "spark") {
          p.vy += 0.06; p.vx *= 0.988; p.vy *= 0.995;
          p.life -= p.decay;

          g.fillStyle = p.color;
          g.beginPath(); g.arc(p.x, p.y, p.r * p.life, 0, 6.2832); g.fill();
          g.globalAlpha = Math.max(0, p.life) * 0.28;
          g.beginPath(); g.arc(p.x, p.y, p.r * 3.4 * p.life, 0, 6.2832); g.fill();
        } else {
          if (p.y < -8) { p.y = h + 6; p.x = Math.random() * w; }
          if (p.x < -8) p.x = w + 6; else if (p.x > w + 8) p.x = -6;
          g.globalAlpha = 0.22 + Math.sin(ts / 900 + p.ph) * 0.18;

    }

  }, [density]);

  useEffect(() => {
    if (!burst) return;
    const cv = ref.current; if (!cv) return;
    const r = cv.getBoundingClientRect();
    const cx = r.width * (burst.x != null ? burst.x : 0.36);
    const cy = r.height * (burst.y != null ? burst.y : 0.62);
    const n = burst.count || 48;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.2832;
      const sp = 1.1 + Math.random() * 4.4;
      parts.current.push({ kind: "spark", x: cx, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
        r: 0.9 + Math.random() * 2.4, life: 1,
        decay: 0.011 + Math.random() * 0.016, color: burst.color || "#fff" });
    }
  }, [burst]);

  return <canvas ref={ref} className="absolute inset-0 pointer-events-none" style={{ width: "100%", height: "100%" }} />;
}

      <g className="wheelSpin" style={{ transformOrigin: `${cx}px ${cy}px` }}>
        {Array.from({ length: spokes }, (_, i) => (
          <path key={i}
            d={`M${cx} ${cy - r * 0.14} L${cx - r * 0.09} ${cy - r * 0.72} L${cx + r * 0.09} ${cy - r * 0.72} Z`}
            fill="#8C919E"
            transform={`rotate(${(i * 360) / spokes} ${cx} ${cy})`} />
        ))}
        <circle cx={cx} cy={cy} r={r * 0.2} fill="#5A5F6B" />
        <circle cx={cx} cy={cy} r={r * 0.2} fill="none" stroke="#9AA0AE" strokeWidth="0.7" />

    </g>

}

/* ---- isometric room ---- */
/* the room diamond is tuned so all four floor corners and the wall tops
   land inside the 400x320 viewBox — nothing clips at the card edge */
const ISO_W = { x: 30, y: 212 };
const ISO_DA = { x: 170, y: -94 };
const ISO_DB = { x: 170, y: 94 };
function isoPt(a, b) { return { x: ISO_W.x + a * ISO_DA.x + b * ISO_DB.x, y: ISO_W.y + a * ISO_DA.y + b * ISO_DB.y }; }
function pStr(...pts) { return pts.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" "); }
function isoFloorQuad(a0, a1, b0, b1) { return pStr(isoPt(a0, b0), isoPt(a1, b0), isoPt(a1, b1), isoPt(a0, b1)); }
function leftWallPt(a, h) { const p = isoPt(a, 0); return { x: p.x, y: p.y - h }; }
function rightWallPt(b, h) { const p = isoPt(1, b); return { x: p.x, y: p.y - h }; }
function wallQuad(side, u0, u1, h0, h1) { const f = side === "left" ? leftWallPt : rightWallPt; return pStr(f(u0, h0), f(u1, h0), f(u1, h1), f(u0, h1)); }
function IsoBox({ a0, a1, b0, b1, h, top, right, left }) {
  const P00 = isoPt(a0, b0), P10 = isoPt(a1, b0), P11 = isoPt(a1, b1), P01 = isoPt(a0, b1);
  const up = (p) => ({ x: p.x, y: p.y - h });
  const P00u = up(P00), P10u = up(P10), P11u = up(P11), P01u = up(P01);
  /* AO: a blurred pool bled out from the footprint so the object is
     bedded into the floor instead of pasted on top of it */
  const g = 3.5;
  const A0 = { x: P00.x - g, y: P00.y }, A1 = { x: P10.x, y: P10.y - g * 0.5 };
  const A2 = { x: P11.x + g, y: P11.y + g * 0.5 }, A3 = { x: P01.x, y: P01.y + g };
  return (
    <g>
      <polygon points={pStr(A0, A1, A2, A3)} fill="#05060A" opacity="0.62" filter="url(#aoBlur)" />
      <polygon points={pStr(P01, P11, P11u, P01u)} fill={left} stroke="rgba(0,0,0,.55)" strokeWidth="1.4" />
      <polygon points={pStr(P10, P11, P11u, P10u)} fill={right} stroke="rgba(0,0,0,.55)" strokeWidth="1.4" />
      <polygon points={pStr(P00u, P10u, P11u, P01u)} fill={top} stroke="rgba(0,0,0,.55)" strokeWidth="1.4" />
      {/* crevice darkening where the vertical faces meet the top */}
      <polyline points={pStr(P01u, P11u, P10u)} fill="none" stroke="#000" strokeOpacity="0.3" strokeWidth="2" />
      {/* a thin lit edge along the top rim reads as a real bevel */}
      <polyline points={pStr(P00u, P10u)} fill="none" stroke="#fff" strokeOpacity="0.16" strokeWidth="1.2" />
    </g>
  );
}
/* palettes tuned like an interior render: warm timber floors, muted

const ROOM_THEMES = {
  none: { wallL: "#26282F", wallR: "#1B1D23", floorA: "#3B3229", floorB: "#332B23", trim: "#5A5F6B", lamp: "#E8D9C0" },

function IsoRug({ a0, a1, b0, b1, base, accent }) {
  return (
    <g>
      <polygon points={isoFloorQuad(a0, a1, b0, b1)} fill={base} />
      <polygon points={isoFloorQuad(a0 + 0.025, a1 - 0.025, b0 + 0.025, b1 - 0.025)} fill="none" stroke={accent} strokeWidth="1.2" opacity="0.6" />
    </g>
  );
}
function IsoLamp({ a, b, h = 44, shade, flicker }) {
  const base = isoPt(a, b), tip = { x: base.x, y: base.y - h };
  return (
    <g>
      <line x1={base.x} y1={base.y} x2={tip.x} y2={tip.y} stroke="#2a2a30" strokeWidth="2.2" />
      <ellipse cx={base.x} cy={base.y + 1} rx="9" ry="3" fill="#111116" />
      <path d={`M${tip.x - 11} ${tip.y} L${tip.x + 11} ${tip.y} L${tip.x + 7} ${tip.y - 12} L${tip.x - 7} ${tip.y - 12} Z`} fill={shade} opacity="0.92" />
      <circle className={flicker ? "lampFlicker" : ""} cx={tip.x} cy={tip.y - 2} r="13" fill={shade} opacity="0.3" />
    </g>
  );
}
/* framed art / poster hung flat on either wall */
function IsoFrame({ side, u0, u1, h0, h1, fill, frame = "#1a1a20" }) {
  return (
    <g>
      <polygon points={wallQuad(side, u0, u1, h0, h1)} fill={frame} />
      <polygon points={wallQuad(side, u0 + 0.012, u1 - 0.012, h0 + 5, h1 - 5)} fill={fill} />
    </g>
  );
}
/* potted plant whose leaves drift, so the room is never fully still */
function IsoPlant({ a, b, scale = 1, pot = "#8A4A32", leaf = "#3FA55C" }) {
  const p = isoPt(a, b);
  const s = scale;
  return (
    <g>
      <path d={`M${p.x - 9 * s} ${p.y - 14 * s} L${p.x + 9 * s} ${p.y - 14 * s} L${p.x + 7 * s} ${p.y} L${p.x - 7 * s} ${p.y} Z`} fill={pot} />

      <g className="leafSway">
        <ellipse cx={p.x} cy={p.y - 30 * s} rx={13 * s} ry={17 * s} fill={leaf} />
        <ellipse cx={p.x - 11 * s} cy={p.y - 22 * s} rx={9 * s} ry={12 * s} fill={leaf} opacity="0.85" transform={`rotate(-32 ${p.x - 11 * s} ${p.y - 22 * s})`} />
        <ellipse cx={p.x + 11 * s} cy={p.y - 23 * s} rx={8 * s} ry={11 * s} fill="#2F8749" transform={`rotate(30 ${p.x + 11 * s} ${p.y - 23 * s})`} />
        <ellipse cx={p.x - 3 * s} cy={p.y - 36 * s} rx={5 * s} ry={7 * s} fill="#57C071" />
      </g>
    </g>
  );
}
/* a mug on a surface, steaming — the smallest detail that sells "lived in" */
function IsoMug({ a, b, h = 0, color = "#E8E4D8" }) {
  const p = isoPt(a, b);

function RoomScene({ propId, stage }) {
  const theme = ROOM_THEMES[propId || "none"];
  const WH = 112;
  const W = isoPt(0, 0), N = isoPt(1, 0), E = isoPt(1, 1);
  const Nu = { x: N.x, y: N.y - WH }, Wu = { x: W.x, y: W.y - WH }, Eu = { x: E.x, y: E.y - WH };
  const GRID = 5;
  const tiles = [];
  for (let i = 0; i < GRID; i++) for (let j = 0; j < GRID; j++) {
    tiles.push(<polygon key={`${i}-${j}`} points={isoFloorQuad(i / GRID, (i + 1) / GRID, j / GRID, (j + 1) / GRID)} fill={(i + j) % 2 === 0 ? theme.floorA : theme.floorB} stroke="rgba(0,0,0,.4)" strokeWidth="1" />);
  }
  /* slat wall: vertical timber battens, the detail that reads "designed" */
  const slats = Array.from({ length: 22 }, (_, i) => {

    const a = leftWallPt(u, 6), b = leftWallPt(u, WH - 8);
    return <line key={i} x1={a.x} y1={a.y} x2={b.x} y2={b.y}
      stroke={i % 2 ? "#000" : theme.trim} strokeOpacity={i % 2 ? 0.34 : 0.14} strokeWidth={i % 2 ? 2.6 : 1.6} />;
  });
  /* the window is the room's light source; everything keys off it */
  const winU0 = 0.3, winU1 = 0.62, winH0 = 44, winH1 = 92;
  return (
    <svg viewBox="0 0 400 320" width="100%" height="100%" preserveAspectRatio="none" style={{ position: "absolute", inset: 0 }}>
      <defs>
        <radialGradient id="roomVignette" cx="50%" cy="15%" r="75%"><stop offset="0%" stopColor="#000" stopOpacity="0" /><stop offset="100%" stopColor="#000" stopOpacity="0.55" /></radialGradient>
        <radialGradient id="depthHaze" cx="0.5" cy="0.36" r="0.62">
          <stop offset="0" stopColor="#6E7BA8" stopOpacity="0.2" />
          <stop offset="0.6" stopColor="#3A4266" stopOpacity="0.07" />
          <stop offset="1" stopColor="#000" stopOpacity="0" />
        </radialGradient>
        {/* real gaussian blur is what makes occlusion read as occlusion */}
        <filter id="aoBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" /></filter>
        <filter id="softLight" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" /></filter>
        <filter id="shaftBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" /></filter>
        {/* light falls off with distance, so the spill fades as it travels */}
        <linearGradient id="spill" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0" stopColor={theme.lamp} stopOpacity="0.42" />
          <stop offset="0.55" stopColor={theme.lamp} stopOpacity="0.16" />
          <stop offset="1" stopColor={theme.lamp} stopOpacity="0" />
        </linearGradient>
        <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="#fff" stopOpacity="0.1" />
          <stop offset="0.5" stopColor="#000" stopOpacity="0" />
          <stop offset="1" stopColor="#000" stopOpacity="0.34" />
        </linearGradient>
        <pattern id="dither" width="3" height="3" patternUnits="userSpaceOnUse">
          <rect width="3" height="3" fill="#000" opacity="0" />
          <rect width="1.4" height="1.4" fill="#000" opacity="0.22" />
          <rect x="1.5" y="1.5" width="1.4" height="1.4" fill="#000" opacity="0.22" />
        </pattern>
      </defs>

      {/* ---- shell ---- */}
      <polygon points={pStr(W, N, Nu, Wu)} fill={theme.wallL} />
      <polygon points={pStr(N, E, Eu, Nu)} fill={theme.wallR} />
      <polygon points={pStr(N, E, Eu, Nu)} fill="#000" opacity="0.22" />
      {slats}
      {/* vertical light gradient down both walls — bounce, not flat fill */}
      <polygon points={pStr(W, N, Nu, Wu)} fill="url(#wallGrad)" />
      <polygon points={pStr(N, E, Eu, Nu)} fill="url(#wallGrad)" />
      <polygon points={pStr(W, N, Nu, Wu)} fill="url(#dither)" />
      <polygon points={pStr(N, E, Eu, Nu)} fill="url(#dither)" />
      <polygon points={pStr(W, N, E, isoPt(0, 1))} fill="url(#depthHaze)" />
      <polygon points={pStr(W, N, Nu, Wu)} fill="url(#depthHaze)" />
      <polygon points={pStr(N, E, Eu, Nu)} fill="url(#depthHaze)" />

      {/* ---- floor: planks with grain, not a checkerboard ---- */}
      <g>{tiles}</g>
      {Array.from({ length: 10 }, (_, i) => {
        const b = i / 10, p0 = isoPt(0, b), p1 = isoPt(1, b);
        return <line key={i} x1={p0.x} y1={p0.y} x2={p1.x} y2={p1.y} stroke="#000" strokeOpacity="0.16" strokeWidth="0.9" />;
      })}
      {/* AO pooling in the crease where floor meets wall */}
      <polyline points={pStr(W, N, E)} fill="none" stroke="#05060A" strokeOpacity="0.75" strokeWidth="9" filter="url(#aoBlur)" />

      {/* ---- the window's light pool thrown across the floor ---- */}
      <polygon points={pStr(isoPt(0.22, 0.02), isoPt(0.78, 0.02), isoPt(0.95, 0.72), isoPt(0.16, 0.62))}
        fill="url(#spill)" filter="url(#softLight)" style={{ mixBlendMode: "screen" }} />

      <polyline points={pStr(W, N, E)} fill="none" stroke={theme.trim} strokeOpacity="0.45" strokeWidth="2" />
      <polyline points={pStr(Wu, Nu, Eu)} fill="none" stroke={theme.trim} strokeOpacity="0.3" strokeWidth="1.6" />

      {furnitureFor(propId, stage)}

      {/* ---- volumetric shafts, blurred so they read as air not glass ---- */}
      <g style={{ mixBlendMode: "screen" }} filter="url(#shaftBlur)">
        {[0, 1, 2].map((i) => {
          const u0 = winU0 + i * 0.1, u1 = u0 + 0.055;
          const t0 = rightWallPt(u0, winH1), t1 = rightWallPt(u1, winH1);
          const f0 = isoPt(0.24 - i * 0.06, 0.5 + i * 0.14), f1 = isoPt(0.38 - i * 0.06, 0.6 + i * 0.14);
          return <polygon key={i} points={pStr(t0, t1, f1, f0)} fill={theme.lamp} opacity={0.13 - i * 0.03} className="godRay" style={{ animationDelay: `${i * 1.6}s` }} />;
        })}
      </g>

      <polygon points={pStr(W, N, E, isoPt(0, 1))} fill="url(#roomVignette)" opacity="0.35" />
    </svg>
  );
}

/* the room is lit by the real clock: dawn warm, noon bright, night cold */
function timeOfDayLight() {
  const h = new Date().getHours();
  if (h < 5) return { tint: "#0A1030", amt: 0.5, ray: "#6E8CFF", label: "NIGHT" };
  if (h < 8) return { tint: "#FF8A4C", amt: 0.24, ray: "#FFB870", label: "DAWN" };
  if (h < 16) return { tint: "#FFE9C4", amt: 0.12, ray: "#FFF0D0", label: "DAY" };
  if (h < 19) return { tint: "#FF7A4C", amt: 0.26, ray: "#FF9E5C", label: "DUSK" };
  return { tint: "#101838", amt: 0.42, ray: "#8FA8FF", label: "NIGHT" };
}

function Terra() {
  const raw = useMemo(load, []);
  const [S, setS] = useState(() => hydrate(raw));
  const [rolloverInfo, setRolloverInfo] = useState(null);
  const [tab, setTab] = useState("today");
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [completeTick, setCompleteTick] = useState(0);
  const [booting, setBooting] = useState(true);
  const [pressedTab, setPressedTab] = useState(null);
  const [levelUp, setLevelUp] = useState(null);
  const stateRef = useRef(S);
  useEffect(() => { stateRef.current = S; }, [S]);

  useEffect(() => {
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const t = setTimeout(() => setBooting(false), reduced ? 0 : 780);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    if (!raw.lastDate) return;
    const { state, info, days } = rollForward(hydrate(raw));
    if (days > 0) { setS(state); setRolloverInfo({ ...info, multi: days > 1, days }); }
  }, []);

  useEffect(() => {
    const id = setInterval(() => {
      const s = stateRef.current;
      if (diffDays(s.lastDate, todayStr()) > 0) {
        const { state, info, days } = rollForward(s);
        setS(state);
        if (info) setRolloverInfo({ ...info, multi: days > 1, days });
      }
    }, 45000);
    return () => clearInterval(id);
  }, []);

  useEffect(() => { save(S); }, [S]);

  const done = S.habits.filter((h) => h.doneToday).length;
  const total = S.habits.length;
  const energy = total ? done / total : 0;
  const shownCash = useCount(Math.round(S.cash));
  const activeTheme = THEMES.find((t) => t.id === S.theme) || THEMES[0];
  const totalDone = S.habits.reduce((s, h) => s + h.total, 0);
  const netWorth = netWorthOf(S);
  const tierIdx = tierIndexFor(netWorth);

  /* promotion fires wherever you are — you earn it on Today, not in Porto */
  const prevTier = useRef(tierIdx);
  useEffect(() => {
    if (tierIdx > prevTier.current) {
      const from = prevTier.current;
      const unlocked = ITEMS.filter((it) => {
        const list = ITEMS.filter((x) => x.slot === it.slot);
        const r = rarityForRank(Math.floor(list.indexOf(it) * 4 / Math.max(1, list.length)));
        return r.minTier > from && r.minTier <= tierIdx;
      }).length;
      setLevelUp({ tier: RANK_TIERS[tierIdx].name, unlocked });
      Sfx.levelUp();
    }
    prevTier.current = tierIdx;
  }, [tierIdx]);

  function complete(id) {
    setS((s) => {
      const h = s.habits.find((x) => x.id === id);
      if (!h || h.doneToday) return s;
      const gain = reward(h.base, h.streak, h.difficulty);
      const bump = priceBumpPct(h);
      const newPrice = Math.round(s.stock.price * (1 + bump) * 100) / 100;
      return { ...s, cash: s.cash + gain, stock: { ...s.stock, price: newPrice },
        habits: s.habits.map((x) => x.id === id ? { ...x, doneToday: true, streak: x.streak + 1, total: x.total + 1 } : x) };
    });
    setCompleteTick((t) => t + 1);
  }
  function removeHabit(id) { setS((s) => ({ ...s, habits: s.habits.filter((h) => h.id !== id) })); }
  function addHabit(name, emoji) {
    if (!name.trim()) return;
    setS((s) => ({ ...s, habits: [...s.habits, { id: Date.now(), name: name.trim(), emoji, base: 15, difficulty: "standard", streak: 0, best: 0, total: 0, doneToday: false, log: [] }] }));
  }
  function updateHabit(id, patch) { setS((s) => ({ ...s, habits: s.habits.map((h) => h.id === id ? { ...h, ...patch } : h) })); }
  function moveHabit(id, dir) {
    setS((s) => {
      const i = s.habits.findIndex((h) => h.id === id); const j = i + dir;
      if (i < 0 || j < 0 || j >= s.habits.length) return s;
      const next = [...s.habits]; [next[i], next[j]] = [next[j], next[i]];
      return { ...s, habits: next };
    });
  }
  function setJournalNote(text) { setS((s) => ({ ...s, journal: { ...s.journal, [s.lastDate]: text } })); }
  function selectTheme(id) { setS((s) => ({ ...s, theme: id })); }
  function buyShares(cashAmt) {
    setS((s) => { const amt = Math.min(cashAmt, s.cash); if (amt <= 0) return s;
      return { ...s, cash: s.cash - amt, stock: { ...s.stock, shares: s.stock.shares + amt / s.stock.price } }; });
  }
  function sellShares(shareAmt) {
    setS((s) => { const amt = Math.min(shareAmt, s.stock.shares); if (amt <= 0) return s;
      return { ...s, cash: s.cash + amt * s.stock.price, stock: { ...s.stock, shares: s.stock.shares - amt } }; });
  }
  function buyItem(item) {
    setS((s) => { if (s.cash < item.price || s.itemsOwned.includes(item.id)) return s;
      return { ...s, cash: s.cash - item.price, itemsOwned: [...s.itemsOwned, item.id], equipped: { ...s.equipped, [item.slot]: item.id } }; });
  }
  function equipItem(slot, id) {
    setS((s) => (id === null || s.itemsOwned.includes(id)) ? { ...s, equipped: { ...s.equipped, [slot]: id } } : s);
  }
  function addAsset(name, emoji, prefix) {
    if (!name.trim()) return;
    setS((s) => ({ ...s, assets: [...s.assets, { id: Date.now(), name: name.trim(), emoji, prefix, value: 0, history: [] }] }));
  }
  function removeAsset(id) { setS((s) => ({ ...s, assets: s.assets.filter((a) => a.id !== id) })); }
  function logEntry(assetId, delta, note) {
    setS((s) => {
      const factor = delta > 0 ? ASSET_BUMP : delta < 0 ? ASSET_DROP : 1;
      const movedPrice = delta !== 0 ? Math.round(s.stock.price * factor * 100) / 100 : s.stock.price;
      return {
        ...s,
        stock: delta !== 0 ? { ...s.stock, price: movedPrice } : s.stock,
        assets: s.assets.map((a) => a.id === assetId ? { ...a, value: a.value + delta, history: [...a.history, { id: Date.now(), date: todayStr(), delta, note }].slice(-200) } : a),
      };
    });
  }

  const TABS = [["today", "Today", Zap], ["assets", "Assets", TrendingUp], ["market", "Market", ShoppingBag], ["character", "Porto", User], ["stats", "History", BarChart3]];
  const tabIndex = TABS.findIndex((x) => x[0] === tab);

  return (
    <ThemeCtx.Provider value={{ accent: activeTheme.accent, accent2: activeTheme.accent2 }}>
      <div className="app-root" style={{ fontFamily: SYS }}>
        <Style />
        <header className="flex items-center justify-between px-6 pb-2"
          style={{ paddingTop: "calc(env(safe-area-inset-top) + 10px)", background: "rgba(10,10,15,0.86)", backdropFilter: "blur(16px)", WebkitBackdropFilter: "blur(16px)", borderBottom: `1px solid ${C.line}` }}>
          <div style={lbl}>{TABS[tabIndex][1]}</div>
          <div className="flex items-center gap-2">
            <Chip>{"$" + shownCash.toLocaleString()}</Chip>
            <Chip>{S.streak > 0 ? "🔥" : "·"} {S.streak}</Chip>
            <button onClick={() => setSettingsOpen(true)} className="p-1.5 rounded-full active:scale-90 transition-transform" style={{ border: `1px solid ${C.line}`, background: C.surf }} aria-label="Settings"><Settings size={16} color={C.soft} /></button>
          </div>
        </header>

        <main key={tab} className="fadeup content">
          {tab === "today" && <Today S={S} done={done} total={total} energy={energy}
            rolloverInfo={rolloverInfo} onDismissRollover={() => setRolloverInfo(null)}
            onComplete={complete} onRemove={removeHabit} onAdd={addHabit} onUpdateHabit={updateHabit} onMoveHabit={moveHabit}
            journalNote={S.journal[S.lastDate] || ""} onJournal={setJournalNote} />}
          {tab === "assets" && <Assets S={S} onAddAsset={addAsset} onRemoveAsset={removeAsset} onLog={logEntry} />}
          {tab === "market" && <Market S={S} onBuyShares={buyShares} onSellShares={sellShares} />}
          {tab === "character" && <Character S={S} totalDone={totalDone} onBuyItem={buyItem} onEquipItem={equipItem} />}
          {tab === "stats" && <Stats S={S} energy={energy} totalDone={totalDone} />}
        </main>

        <nav className="pt-2 px-2" style={{ paddingBottom: "calc(env(safe-area-inset-bottom) + 8px)", background: "rgba(10,10,15,0.92)", backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)", borderTop: `1px solid ${C.line}` }}>
          <div className="relative flex">
            <div className="absolute top-0 h-full transition-all duration-300" style={{ left: `${tabIndex * 20}%`, width: "20%", padding: "0 6px" }}>
              <div className="w-full h-full rounded-2xl" style={{ background: C.surf2, border: `1px solid ${C.line}` }} />
            </div>
            {TABS.map(([key, label, Icon]) => {
              const on = tab === key;
              return (
                <button key={key} type="button"
                  onPointerDown={() => setPressedTab(key)}
                  onPointerUp={() => setPressedTab(null)}
                  onPointerCancel={() => setPressedTab(null)}
                  onPointerLeave={() => setPressedTab(null)}
                  onClick={(e) => { e.currentTarget.blur(); setPressedTab(null); setTab(key); }}
                  className="relative flex-1 flex flex-col items-center gap-0.5 py-2 navBtn"
                  style={{ transform: pressedTab === key ? "scale(0.9)" : "scale(1)", transition: "transform .15s var(--quick)" }}>
                  <Icon size={19} color={on ? activeTheme.accent : C.soft} strokeWidth={on ? 2.6 : 2} />
                  <span className="text-[9px] font-bold" style={{ color: on ? activeTheme.accent : C.soft, fontFamily: MONO, letterSpacing: "0.02em" }}>{label}</span>
                </button>
              );
            })}
          </div>
        </nav>

        {settingsOpen && <SettingsSheet theme={S.theme} onSelect={selectTheme} onClose={() => setSettingsOpen(false)} />}
        {levelUp && <LevelUpCinematic data={levelUp} onDone={() => setLevelUp(null)} />}
        <BootOverlay show={booting} />
      </div>
    </ThemeCtx.Provider>
  );
}

function BootOverlay({ show }) {
  const { accent } = useAccent();
  const [visible, setVisible] = useState(true);
  useEffect(() => { if (!show) { const t = setTimeout(() => setVisible(false), 260); return () => clearTimeout(t); } }, [show]);
  if (!visible) return null;
  return (
    <div className="absolute inset-0 z-50 pointer-events-none overflow-hidden" style={{ background: C.app, opacity: show ? 1 : 0, transition: "opacity .26s var(--snap)" }}>
      <div className="absolute left-0 right-0 bootScan" style={{ height: 2, background: `linear-gradient(90deg, transparent, ${accent}, transparent)`, boxShadow: `0 0 18px ${accent}` }} />
      <div className="absolute inset-0 flex flex-col items-center justify-center gap-2 bootFade">
        <span style={{ fontFamily: MONO, fontSize: 13, letterSpacing: "0.35em", color: accent, fontWeight: 700 }}>ISWR</span>
        <span style={{ fontFamily: DISPLAY, fontSize: 22, fontWeight: 800, color: C.ink, letterSpacing: "-0.01em" }}>ASCEND</span>
      </div>
    </div>
  );
}

function Chip({ children }) {
  return <span className="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[13px] font-bold" style={{ border: `1px solid ${C.line}`, background: C.surf, color: C.ink, fontFamily: MONO }}>{children}</span>;
}

    <div className="absolute inset-0 z-30 flex items-end justify-center" style={{ background: `rgba(0,0,0,${show ? 0.6 : 0})`, transition: "background .22s var(--snap)" }} onClick={() => close()}>
      <div className="w-full rounded-t-[32px] p-5" style={{ background: C.surf, border: `1px solid ${C.line}`, borderBottom: "none", transform: show ? "translateY(0)" : "translateY(28px)", opacity: show ? 1 : 0, transition: "transform .28s var(--snap), opacity .22s var(--snap)" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div className="text-[18px] font-extrabold" style={{ fontFamily: DISPLAY, color: C.ink }}>Settings</div>
          <button onClick={() => close()} style={{ color: C.soft }}><X size={18} /></button>
        </div>
        <div style={lbl} className="mb-3">Accent theme</div>
        <div className="grid grid-cols-5 gap-2">
          {THEMES.map((t) => (
            <button key={t.id} onClick={() => onSelect(t.id)} className="flex flex-col items-center gap-1.5 hoverLift press">
              <div className="rounded-full" style={{ width: 38, height: 38, background: `linear-gradient(135deg, ${t.accent}, ${t.accent2})`, boxShadow: theme === t.id ? `0 0 0 3px ${C.surf}, 0 0 0 5px ${t.accent}` : "none" }} />
              <span className="text-[9px]" style={{ color: theme === t.id ? t.accent : C.soft, fontFamily: MONO }}>{t.name}</span>
            </button>
          ))}
        </div>
        <div style={{ height: "env(safe-area-inset-bottom)", paddingTop: 16 }} />
      </div>
    </div>
  );
}

function Today({ S, done, total, energy, rolloverInfo, onDismissRollover, onComplete, onRemove, onAdd, onUpdateHabit, onMoveHabit, journalNote, onJournal }) {
  const { accent } = useAccent();
  const [adding, setAdding] = useState(false);
  const [editMode, setEditMode] = useState(false);
  const [editingHabit, setEditingHabit] = useState(null);
  const [detailHabit, setDetailHabit] = useState(null);
  const hour = new Date().getHours();
  const greeting = hour < 5 ? "Late night" : hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  const price = S.stock.price;
  const shownPrice = useCount(price, 2);
  const flash = usePriceFlash(price);
  const openPrice = S.stock.history.length ? S.stock.history[S.stock.history.length - 1].price : BASE_PRICE;
  const up = price >= openPrice;
  const changePct = openPrice ? ((price - openPrice) / openPrice) * 100 : 0;

  return (
    <div className="pb-8">
      <div className="px-4 pt-2">
        {rolloverInfo && <RolloverToast info={rolloverInfo} onDismiss={onDismissRollover} />}
      </div>
      <div className="px-6 pt-1 pb-3">
        <div className="text-[14px] font-medium" style={{ color: C.soft }}>{greeting}</div>
        <div className="text-[25px] font-extrabold" style={{ color: C.ink, fontFamily: DISPLAY, letterSpacing: "-0.02em" }}>
          {done === total && total > 0 ? "All logged today" : `${total - done} habit${total - done === 1 ? "" : "s"} left`}
        </div>
        <div className="flex items-center gap-2 mt-1">
          <span className="text-[11px]" style={{ color: C.soft, fontFamily: MONO }}>{prettyDate(S.lastDate)}</span>
          <span className="text-[11px]" style={{ color: C.soft, fontFamily: MONO }}>·</span>
          <span className={"text-[11px] font-bold" + (flash ? " tickFlash" : "")} style={{ color: up ? C.good : C.ember, fontFamily: MONO }}>ISWR {"$" + shownPrice.toFixed(2)} <span className={flash ? "arrowBounce" : ""} style={{ display: "inline-block" }}>{up ? "▲" : "▼"}</span>{Math.abs(changePct).toFixed(1)}%</span>
        </div>
      </div>

      <div className="px-4">
        <div className="flex items-center justify-between mb-2.5 px-1">
          <div style={lbl}>Habits</div>
          <div className="flex items-center gap-3">
            <button onClick={() => setEditMode((m) => !m)} className="text-[13px] font-bold uppercase active:scale-95 transition-transform" style={{ color: editMode ? C.gold : C.soft, fontFamily: MONO, letterSpacing: "0.04em" }}>{editMode ? "Done" : "Edit"}</button>
            <button onClick={() => setAdding(true)} className="flex items-center gap-1 text-[13px] font-bold uppercase active:scale-95 transition-transform" style={{ color: accent, fontFamily: MONO, letterSpacing: "0.04em" }}><Plus size={15} /> Add</button>
          </div>
        </div>
        {adding && <AddRow onAdd={(n, e) => { onAdd(n, e); setAdding(false); }} onCancel={() => setAdding(false)} />}
        {S.habits.length === 0 ? (
          <EmptyState icon="✓" title="No habits yet" body="Add your first one — every rep starts moving ISWR." />
        ) : (
          <div className="flex flex-col gap-2">
            {S.habits.map((h, i) => (
              <div key={h.id} className="rowIn" style={{ animationDelay: `${Math.min(i, 6) * 40}ms` }}>
                <HabitRow h={h} idx={i} count={S.habits.length} editing={editMode}
                  onComplete={onComplete} onRemove={onRemove} onMove={onMoveHabit}
                  onOpenDetail={() => setDetailHabit(h)} onOpenEdit={() => setEditingHabit(h)} />
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="px-4 mt-6">
        <div style={lbl} className="mb-2 px-1">Log</div>
        <textarea value={journalNote} onChange={(e) => onJournal(e.target.value)} placeholder="Anything worth noting today…" rows={2}
          className="w-full px-3.5 py-3 rounded-2xl text-[13px] outline-none resize-none" style={{ background: C.surf, color: C.ink, border: `1px solid ${C.line}` }} />
      </div>

      {detailHabit && <HabitDetail habit={S.habits.find((h) => h.id === detailHabit.id) || detailHabit} onClose={() => setDetailHabit(null)} />}
      {editingHabit && <EditHabitSheet habit={editingHabit} onCancel={() => setEditingHabit(null)} onSave={(patch) => { onUpdateHabit(editingHabit.id, patch); setEditingHabit(null); }} />}
    </div>
  );
}

function RolloverToast({ info, onDismiss }) {
  const [show, setShow] = useState(false);
  useEffect(() => { const id = requestAnimationFrame(() => setShow(true)); return () => cancelAnimationFrame(id); }, []);
  function dismiss() { setShow(false); setTimeout(onDismiss, 220); }
  useEffect(() => { const id = setTimeout(dismiss, 6000); return () => clearTimeout(id); }, []);
  const move = info.movePct || 0;
  const moveTint = move > 0.001 ? C.good : move < -0.001 ? C.ember : C.soft;
  const priceLine = ` ISWR $${info.price.toFixed(2)}`;
  const msg = info.multi
    ? `Welcome back — ${info.days} day${info.days === 1 ? "" : "s"} passed while you were away.`
    : info.streakBroken ? "Streak reset — yesterday went untended."
    : `Yesterday: ${info.done}/${info.total} tended.`;
  return (
    <div onClick={dismiss} className="mb-2 px-4 py-3 rounded-2xl flex items-center gap-2.5 active:scale-[0.98] press" style={{ background: C.surf2, border: `1px solid ${C.line}`, transform: show ? "translateY(0)" : "translateY(-16px)", opacity: show ? 1 : 0, transition: "transform .3s var(--snap), opacity .24s var(--snap)" }}>
      <span className="text-[16px]">{info.streakBroken ? "💤" : "🔔"}</span>
      <span className="text-[12.5px] flex-1" style={{ color: C.ink }}>
        {msg}
        <span style={{ color: moveTint, fontFamily: MONO, fontWeight: 700 }}>{priceLine}</span>
        <span style={{ color: moveTint, fontFamily: MONO, fontWeight: 700 }}>{` ${move >= 0 ? "▲" : "▼"}${Math.abs(move).toFixed(2)}%`}</span>
      </span>
    </div>
  );
}

function HabitRow({ h, idx, count, editing, onComplete, onRemove, onMove, onOpenDetail, onOpenEdit }) {
  const { accent } = useAccent();
  const [burst, setBurst] = useState(false);
  const gain = reward(h.base, h.streak, h.difficulty), mult = multiplier(h.streak);
  const bumpPct = (priceBumpPct(h) * 100).toFixed(1);
  function tap() { if (h.doneToday) return; setBurst(true); setTimeout(() => setBurst(false), 850); onComplete(h.id); }
  return (
    <div className="relative flex items-center gap-3 p-3 rounded-[22px] transition-all"
         style={{ background: h.doneToday ? "rgba(46,213,115,0.08)" : C.surf, border: `1px solid ${h.doneToday ? "rgba(46,213,115,0.35)" : C.line}`, boxShadow: h.doneToday ? "none" : SHADOW }}>
      <div onClick={() => !editing && onOpenDetail()} className="flex items-center justify-center rounded-2xl text-xl" style={{ width: 46, height: 46, background: h.doneToday ? "rgba(46,213,115,0.14)" : C.surf2 }}>{h.emoji}</div>
      <div className="flex-1 min-w-0" onClick={() => !editing && onOpenDetail()}>
        <div className="font-semibold truncate text-[15px]" style={{ color: C.ink }}>{h.name}</div>
        <div className="flex items-center gap-2 text-[12px] mt-0.5 flex-wrap">

          <MiniStat label="Since IPO" value={`${totalChangePct >= 0 ? "+" : ""}${totalChangePct.toFixed(1)}%`} />
          <MiniStat label="Position" value={`$${portfolioValue.toFixed(0)}`} />
        </div>
      </div>

      <div className="p-5 rounded-[26px] mb-4 text-center relative overflow-hidden" style={{ background: `linear-gradient(135deg, ${accent}, ${accent}55)`, boxShadow: SHADOW, border: `1px solid ${C.line}` }}>
        {confirm && <div className="absolute inset-0 flex items-center justify-center confirmFlash" style={{ background: "rgba(255,255,255,.22)" }}><Check size={28} color={C.app} strokeWidth={3} /></div>}
        <div className="text-[11px] font-semibold tracking-wide uppercase relative" style={{ color: "rgba(10,10,15,.7)", fontFamily: MONO }}>Your Position</div>
        <div className="text-4xl font-black my-1 relative" style={{ color: C.app, letterSpacing: "-1px", fontFamily: DISPLAY }}>{"$" + portfolioValue.toFixed(2)}</div>
        <div className="text-[12px] relative" style={{ color: "rgba(10,10,15,.75)", fontFamily: MONO }}>{shares.toFixed(3)} shares @ {"$" + price.toFixed(2)}</div>
      </div>
      <div className="flex gap-2 mb-3">
        <button onClick={() => { setMode("buy"); setErr(""); }} className="flex-1 py-2 rounded-xl text-[12.5px] font-bold uppercase hoverLift press" style={{ background: mode === "buy" ? C.good : C.surf2, color: mode === "buy" ? C.app : C.soft, fontFamily: MONO }}>Buy</button>
        <button onClick={() => { setMode("sell"); setErr(""); }} disabled={shares <= 0} className="flex-1 py-2 rounded-xl text-[12.5px] font-bold uppercase hoverLift press" style={{ background: mode === "sell" ? C.ember : C.surf2, color: shares <= 0 ? "#4A4A55" : mode === "sell" ? C.app : C.soft, fontFamily: MONO }}>Sell</button>
      </div>
      <div className="flex gap-2 mb-1.5">
        <input type="number" value={amt} onChange={(e) => setAmt(e.target.value)} placeholder={mode === "buy" ? `Cash to invest (have $${Math.round(S.cash)})` : `Shares to sell (have ${shares.toFixed(3)})`} className={"flex-1 px-3.5 py-2.5 rounded-xl text-[14px] outline-none focusRing" + (err ? " shake" : "")} style={{ background: C.surf2, color: C.ink, border: `1px solid ${err ? C.ember : C.line}` }} />
        <button onClick={submit} className="px-4 rounded-xl font-bold text-[13px] uppercase hoverLift press" style={{ background: accent, color: C.app, fontFamily: MONO }}>{mode === "buy" ? "Buy" : "Sell"}</button>
      </div>
      <div className="text-[11px] text-center" style={{ color: err ? C.ember : C.soft, fontFamily: MONO }}>{err || (mode === "buy" ? `≈ ${(Number(amt || 0) / price).toFixed(3)} shares at $${price.toFixed(2)}` : `≈ $${(Number(amt || 0) * price).toFixed(2)} at $${price.toFixed(2)}/share`)}</div>
    </div>
  );
}

function StatRing({ label, value, glyph, tint, size = 54 }) {
  const r = (size - 7) / 2;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(1, value));
  return (
    <div className="flex flex-col items-center" style={{ width: size + 6 }}>
      <div className="relative" style={{ width: size, height: size }}>
        <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.surf2} strokeWidth="4.5" />
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={tint} strokeWidth="4.5" strokeLinecap="round"
            strokeDasharray={c} strokeDashoffset={c * (1 - pct)} style={{ transition: "stroke-dashoffset .9s var(--snap)" }} />
        </svg>
        <div className="absolute inset-0 flex items-center justify-center text-[13px]" style={{ color: tint }}>{glyph}</div>
      </div>
      <div className="text-[8.5px] font-bold uppercase mt-1.5 text-center leading-tight" style={{ color: C.soft, fontFamily: MONO, letterSpacing: "0.03em" }}>{label}</div>
      <div className="text-[10px] font-bold" style={{ color: C.ink, fontFamily: MONO }}>{Math.round(pct * 100)}%</div>
    </div>
  );
}

function CollectionRow({ slot, S, tierIdx, onBuy, onEquip, lootId }) {
  const { accent } = useAccent();
  const items = ITEMS.filter((i) => i.slot === slot);
  const collected = items.filter((i) => S.itemsOwned.includes(i.id)).length;
  return (
    <div className="mb-6">
      <div className="flex items-center justify-between px-4 mb-2">
        <div style={lbl}>{SLOT_LABELS[slot]}</div>
        <div className="text-[10px] font-bold" style={{ color: C.soft, fontFamily: MONO }}>{collected}/{items.length} held</div>
      </div>
      <div className="flex gap-2.5 overflow-x-auto px-4 pb-1" style={{ scrollSnapType: "x proximity" }}>
        <button onClick={() => onEquip(slot, null)} className="shrink-0 flex flex-col items-center justify-center rounded-[18px] hoverLift press" style={{ width: 104, height: 138, background: C.surf, border: `1px solid ${!S.equipped[slot] ? accent : C.line}`, boxShadow: !S.equipped[slot] ? `0 0 0 1px ${accent}44, 0 0 14px ${accent}33` : "none", scrollSnapAlign: "start" }}>
          <div className="text-xl mb-1" style={{ color: C.soft }}>—</div>
          <div className="text-[10px] font-bold uppercase" style={{ color: C.soft, fontFamily: MONO }}>None</div>
        </button>
        {items.map((item, idx) => {
          const rarity = rarityForRank(Math.floor(idx * 4 / Math.max(1, items.length)));
          const owned = S.itemsOwned.includes(item.id);
          const isEquipped = S.equipped[slot] === item.id;
          const afford = S.cash >= item.price;
          const locked = tierIdx < rarity.minTier;
          const looting = lootId === item.id;
          const price = item.price >= 1000 ? `$${(item.price / 1000).toFixed(item.price >= 10000 ? 0 : 1)}k` : `$${item.price}`;
          return (
            <div key={item.id} className={"shrink-0 relative flex flex-col items-center text-center rounded-[18px] hoverLift overflow-hidden" + (looting ? " lootPop" : "")} style={{ width: 104, height: 138, padding: "9px 7px 8px", background: C.surf, border: `1px solid ${isEquipped ? accent : C.line}`, boxShadow: isEquipped ? `0 0 0 1px ${accent}44, 0 0 16px ${accent}40, ${SHADOW}` : SHADOW, scrollSnapAlign: "start" }}>
              {looting && <div className="absolute inset-0 pointer-events-none lootBeam" style={{ background: `linear-gradient(to top, transparent, ${rarity.color}aa, transparent)` }} />}
              {/* the grade badge reads like a bond rating, not a loot tier */}
              <div className="absolute top-1.5 left-1.5 px-1 rounded text-[7px] font-black z-10" style={{ color: rarity.color, background: `${rarity.color}1F`, border: `0.5px solid ${rarity.color}66`, fontFamily: MONO, letterSpacing: "0.04em" }}>{rarity.grade}</div>
              {/* the drawn product shot, on its own lit plinth */}
              <div className="relative mb-1 w-full flex items-center justify-center" style={{ height: 52 }}>
                <div className="absolute rounded-full" style={{ bottom: 2, width: 56, height: 12, background: `radial-gradient(ellipse, ${rarity.color}2E, transparent 70%)` }} />
                <div style={{ opacity: locked ? 0.3 : 1, filter: locked ? "grayscale(1)" : "none", transition: "filter .3s var(--snap)" }}>
                  <ItemArt item={item} size={44} active={!locked} />
                </div>
                {locked && <div className="absolute inset-0 flex items-center justify-center text-[15px]">🔒</div>}
              </div>
              <div className="text-[10.5px] font-semibold mb-0.5 truncate w-full" style={{ color: locked ? C.soft : C.ink }}>{item.name}</div>
              <div className="text-[7.5px] font-bold uppercase mb-1.5" style={{ color: rarity.color, fontFamily: MONO, letterSpacing: "0.08em" }}>{rarity.label}</div>
              {locked ? (
                <div className="w-full py-1 rounded-lg text-[8.5px] font-bold" style={{ background: C.surf2, color: C.soft, fontFamily: MONO, letterSpacing: "0.03em" }}>{RANK_TIERS[rarity.minTier].name}</div>
              ) : owned ? (
                <button onClick={() => onEquip(slot, item.id)} className="w-full py-1 rounded-lg text-[10px] font-bold press" style={{ background: isEquipped ? accent : C.surf2, color: isEquipped ? C.app : C.soft }}>{isEquipped ? "Active" : "Hold"}</button>
              ) : (
                <button onClick={() => onBuy(item)} disabled={!afford} className="w-full py-1 rounded-lg text-[10.5px] font-bold press" style={{ background: afford ? accent : C.surf2, color: afford ? C.app : "#4A4A55", fontFamily: MONO }}>{price}</button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}
function Character({ S, totalDone, onBuyItem, onEquipItem }) {
  const { accent } = useAccent();
  const netWorth = useMemo(() => netWorthOf(S), [S.cash, S.itemsOwned, S.stock.shares, S.stock.price]);
  const tierInfo = useMemo(() => nextTierInfo(netWorth), [netWorth]);
  const tierIdx = tierInfo.index;
  const stage = stageFor(totalDone);
  const [pulse, setPulse] = useState(false);
  const [burst, setBurst] = useState(null);
  const [shake, setShake] = useState(false);
  const [lootId, setLootId] = useState(null);
  const [muted, setMuted] = useState(() => Sfx.isMuted());

  function fire(kind, item) {
    const rar = item ? rarityForRank(ITEMS.filter((x) => x.slot === item.slot).indexOf(item)) : null;
    setPulse(true); setTimeout(() => setPulse(false), 500);
    setBurst({ x: 0.36, y: 0.6, count: kind === "buy" ? 62 : 28, color: rar ? rar.color : accent, k: Date.now() });
    if (kind === "buy") {
      Sfx.purchase();
      setShake(true); setTimeout(() => setShake(false), 720);
      setLootId(item.id); setTimeout(() => setLootId(null), 900);
    } else Sfx.equip();
  }
  function buy(item) {
    if (S.cash < item.price) { Sfx.denied(); return; }
    onBuyItem(item); fire("buy", item);
  }
  function equip(slot, id) {
    onEquipItem(slot, id);
    fire("equip", id ? ITEMS.find((i) => i.id === id) : null);
  }
  function toggleMute() {
    const m = !muted;
    setMuted(m); Sfx.setMuted(m);
    if (!m) Sfx.tap();
  }

  const energy = S.habits.length ? S.habits.filter((h) => h.doneToday).length / S.habits.length : 0;
  const stats = useMemo(() => computeCharacterStats(S, energy), [S, energy]);
  const eq = useMemo(() => resolveEquipped(S.equipped), [S.equipped]);
  const tint = { discipline: accent, energy: C.gold, focus: "#4FA3FF", streak: "#FF9E4A", consistency: C.good };
  /* every acquisition is a position; book value is what you paid for them */
  const ALLOC_COLORS = { outfit: accent, head: "#4FA3FF", watch: "#C9CED8", aura: "#B968FF", sidekick: C.good, car: "#FF9E4A", property: C.gold, art: "#FF5C72" };
  const { bookValue, alloc } = useMemo(() => {
    const held = ITEMS.filter((i) => S.itemsOwned.includes(i.id));
    const total = held.reduce((sum, i) => sum + i.price, 0);
    const a = SLOTS.map((slot) => {
      const v = held.filter((i) => i.slot === slot).reduce((sum, i) => sum + i.price, 0);
      return { slot, value: v, pct: total ? v / total : 0, color: ALLOC_COLORS[slot] };
    });
    return { bookValue: total, alloc: a };
  }, [S.itemsOwned, accent]);
  return (
    <div className="pb-6 pt-2">
      <div className="px-6 mb-3">
        <div className="text-[25px] font-extrabold" style={{ color: C.ink, fontFamily: DISPLAY, letterSpacing: "-0.02em" }}>Porto</div>
        <div className="text-[13px] mt-0.5" style={{ color: C.soft }}>Your discipline is the underlying asset. Tilt the card.</div>
      </div>

      <InvestorCard S={S} netWorth={netWorth} tierInfo={tierInfo}
        pulse={pulse} burst={burst} shake={shake} muted={muted} onToggleMute={toggleMute} />

      {/* ---- book value: what the account is actually worth ---- */}
      <div className="mx-4 mt-4 mb-5 p-4 rounded-[20px]" style={{ background: C.surf, border: `1px solid ${C.line}`, boxShadow: SHADOW }}>
        <div className="flex items-start justify-between mb-3">
          <div>
            <div style={lbl}>Book value</div>
            <div className="text-[27px] font-extrabold leading-none mt-1" style={{ color: C.ink, fontFamily: MONO, letterSpacing: "-0.02em" }}>
              ${bookValue.toLocaleString()}
            </div>
          </div>
          <div className="text-right">
            <div style={lbl}>Tier</div>
            <div className="text-[13px] font-extrabold mt-1" style={{ color: accent, fontFamily: MONO, letterSpacing: "0.1em" }}>{tierInfo.tier.name}</div>
          </div>
        </div>
        {/* allocation across asset classes, weighted by what each cost */}
        <div className="flex h-1.5 rounded-full overflow-hidden mb-2" style={{ background: C.surf2 }}>
          {alloc.map((a) => a.pct > 0 && (
            <div key={a.slot} style={{ width: `${a.pct * 100}%`, background: a.color, transition: "width .5s var(--snap)" }} />
          ))}
        </div>
        <div className="flex flex-wrap gap-x-3 gap-y-1">
          {alloc.filter((a) => a.pct > 0).map((a) => (
            <div key={a.slot} className="flex items-center gap-1">
              <span className="rounded-full" style={{ width: 5, height: 5, background: a.color }} />
              <span className="text-[9px] font-bold" style={{ color: C.soft, fontFamily: MONO }}>{SLOT_LABELS[a.slot]} {Math.round(a.pct * 100)}%</span>
            </div>
          ))}
          {bookValue === 0 && <span className="text-[10px]" style={{ color: C.soft, fontFamily: MONO }}>No positions yet — earn cash on Today, then acquire below.</span>}
        </div>
      </div>

      {/* ---- performance metrics, framed the way a broker would ---- */}
      <div style={lbl} className="px-5 mb-2">Performance</div>
      <div className="flex justify-between px-5 mb-6">
        {stats.map((s) => <StatRing key={s.key} label={s.label} value={s.value} glyph={s.glyph} tint={tint[s.key]} />)}
      </div>

      <div style={lbl} className="px-5 mb-2">Holdings</div>
      {SLOTS.map((slot) => <CollectionRow key={slot} slot={slot} S={S} tierIdx={tierIdx} lootId={lootId} onBuy={buy} onEquip={equip} />)}

      {/* ---- the vault: what those positions actually look like ---- */}
      <div className="flex items-center justify-between px-5 mb-2 mt-1">
        <div style={lbl}>The vault</div>
        <div className="text-[10px] font-bold" style={{ color: C.soft, fontFamily: MONO }}>Drag to look around</div>
      </div>
      <CharacterScene S={S} stage={stage} pulse={pulse} burst={burst} shake={shake}
        muted={muted} onToggleMute={toggleMute} compact />
      <div className="px-6 mt-2 text-[11px]" style={{ color: C.soft }}>
        Every position you hold shows up here — apparel on you, vehicles in the bay, real estate as the room itself.
      </div>
    </div>
  );
}

function Stats({ S, energy, totalDone }) {
  const { accent } = useAccent();
  const grid = useMemo(() => {
    const cells = S.dayLog.slice(-27).map((d) => (d.total ? d.done / d.total : 0));
    while (cells.length < 27) cells.unshift(null);
    cells.push(energy);
    return cells;
  }, [S.dayLog, energy]);
  const cell = (v) => v == null ? C.surf2 : v < 0.4 ? "#2A2A3A" : v < 0.75 ? `${accent}55` : accent;
  const bestDay = S.dayLog.reduce((m, d) => Math.max(m, d.done), 0);
  const bestWeek = bestWeekPct(S.dayLog);
  const athPrice = Math.max(BASE_PRICE, S.stock.price, ...S.stock.history.map((h) => h.price));
  const totalChangePct = ((S.stock.price / BASE_PRICE) - 1) * 100;
  const portfolioValue = S.stock.shares * S.stock.price;
  const journalEntries = useMemo(() => Object.entries(S.journal || {}).filter(([, v]) => v && v.trim()).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 12), [S.journal]);

  return (
    <div className="px-4 pb-6 pt-2">
      <div className="px-2 mb-3"><div className="text-[25px] font-extrabold" style={{ color: C.ink, fontFamily: DISPLAY, letterSpacing: "-0.02em" }}>History</div></div>

      <div className="p-4 rounded-[26px] mb-4" style={{ background: C.surf, border: `1px solid ${C.line}`, boxShadow: SHADOW }}>
        <div className="flex items-center justify-between mb-2">
          <div style={lbl}>ISWR · Iswara Capital</div>
          <span className="text-[12px] font-bold" style={{ color: totalChangePct >= 0 ? C.good : C.ember, fontFamily: MONO }}>{(totalChangePct >= 0 ? "+" : "") + totalChangePct.toFixed(1) + "% since IPO"}</span>
        </div>
        <div className="grid grid-cols-3 gap-2">
          <MiniStat label="Price" value={`$${S.stock.price.toFixed(2)}`} />
          <MiniStat label="All-time high" value={`$${athPrice.toFixed(2)}`} />
          <MiniStat label="Position" value={`$${portfolioValue.toFixed(0)}`} />
        </div>
      </div>

      <div className="grid grid-cols-2 gap-2.5 mb-4">
        <Stat big={S.streak} unit="day streak" icon="🔥" tint="#FF9E4A" />
        <Stat big={`$${Math.round(portfolioValue)}`} unit="ISWR position" icon="💹" tint={accent} />
        <Stat big={totalDone} unit="habits tended" icon="✓" tint={C.good} />
        <Stat big={S.assets.length} unit="assets tracked" icon="📊" tint={C.gold} />
      </div>

      <div className="p-4 rounded-[26px] mb-4" style={{ background: C.surf, border: `1px solid ${C.line}`, boxShadow: SHADOW }}>
        <div style={lbl} className="mb-3">Last 28 days</div>
        <div className="grid gap-1.5" style={{ gridTemplateColumns: "repeat(7,1fr)" }}>
          {grid.map((v, i) => <div key={i} className={i === grid.length - 1 ? "trackpulse" : ""} style={{ aspectRatio: "1", borderRadius: 8, background: cell(v), border: i === grid.length - 1 ? `2px solid ${accent}` : "none" }} />)}
        </div>
      </div>

      <div style={lbl} className="mb-2 px-1">Personal records</div>
      <div className="grid grid-cols-3 gap-2.5 mb-4">
        <MiniStat label="Best streak" value={`${S.bestStreakEver}d`} />
        <MiniStat label="Best day" value={bestDay} />
        <MiniStat label="Best week" value={`${bestWeek}%`} />
      </div>

      {journalEntries.length > 0 && <>
        <div style={lbl} className="mb-2 px-1">Log history</div>
        <div className="flex flex-col gap-2">
          {journalEntries.map(([date, text]) => (
            <div key={date} className="p-3 rounded-2xl" style={{ background: C.surf, border: `1px solid ${C.line}` }}>
              <div className="text-[10px] uppercase mb-1" style={{ color: C.soft, fontFamily: MONO, letterSpacing: "0.04em" }}>{date}</div>
              <div className="text-[13px]" style={{ color: C.ink }}>{text}</div>
            </div>
          ))}
        </div>
      </>}
    </div>
  );
}
function Stat({ big, unit, icon, tint }) {
  return (
    <div className="p-4 rounded-[22px]" style={{ background: C.surf, border: `1px solid ${C.line}`, boxShadow: SHADOW }}>
      <div className="text-[15px] mb-1">{icon}</div>
      <div className="text-[26px] font-bold leading-none" style={{ color: tint, letterSpacing: "-1px", fontFamily: MONO }}>{big}</div>
      <div className="text-[11px] mt-1 uppercase" style={{ color: C.soft, fontFamily: MONO, letterSpacing: "0.03em" }}>{unit}</div>
    </div>

}

      @keyframes compFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      .companionFloat{animation:compFloat 3s ease-in-out infinite}
      @keyframes twinkle2{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
      .twinkle2{animation:twinkle2 2.2s ease-in-out infinite}
      @keyframes wheelSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
      .wheelSpin{animation:wheelSpin 5s linear infinite}
      @keyframes carDriveIn{0%{transform:translateX(150px) scale(.92);opacity:0;filter:blur(6px)}55%{opacity:1}100%{transform:translateX(0) scale(1);opacity:1;filter:blur(0)}}
      .carDriveIn{animation:carDriveIn .85s cubic-bezier(.2,.8,.2,1) both}
      @keyframes sceneMote{0%{transform:translateY(0);opacity:0}15%{opacity:.55}88%{opacity:.25}100%{transform:translateY(-230px);opacity:0}}
      .sceneMote{animation:sceneMote linear infinite}
      @keyframes revealRing{0%{transform:scale(.3);opacity:.9}100%{transform:scale(7);opacity:0}}
      .revealRing{animation:revealRing .6s ease-out forwards}
      @keyframes revealSpark{0%{transform:rotate(var(--ang)) translateX(0) scale(1);opacity:1}100%{transform:rotate(var(--ang)) translateX(72px) scale(.4);opacity:0}}

      /* ---- isometric room + showroom car ---- */
      @keyframes speedLine{0%{transform:translateX(0);opacity:0}20%{opacity:.8}100%{transform:translateX(-46px);opacity:0}}
      .speedLine{animation:speedLine 1.3s var(--soft) infinite}
      @keyframes lampFlicker{0%,100%{opacity:.85}50%{opacity:1}}
      .lampFlicker{animation:lampFlicker 2.6s ease-in-out infinite}
      @keyframes gemGlint{0%,100%{opacity:.6}50%{opacity:1}}
      .gemGlint{animation:gemGlint 1.8s ease-in-out infinite}

      /* ---- level HUD + progression ---- */
      @keyframes xpShine{0%{transform:translateX(-60%)}100%{transform:translateX(160%)}}
      .xpShine{background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); width:40%; animation:xpShine 2.6s var(--soft) infinite}
      @keyframes legendPulse{0%,100%{box-shadow:0 0 0 1px rgba(245,180,41,.35), 0 0 26px rgba(245,180,41,.22)}50%{box-shadow:0 0 0 1px rgba(245,180,41,.6), 0 0 40px rgba(245,180,41,.4)}}
      .legendRim{animation:legendPulse 2.8s ease-in-out infinite}
      @keyframes emberRise{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-160px) translateX(var(--drift,8px));opacity:0}}
      .emberRise{animation:emberRise linear infinite}
      @keyframes trophyGlint{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
      .trophyGlint{animation:trophyGlint 2.4s ease-in-out infinite}

      /* ---- level-up cinematic ---- */
      @keyframes luFlash{0%{opacity:0}6%{opacity:.85}26%{opacity:.16}70%{opacity:.1}100%{opacity:0}}
      .luFlash{animation:luFlash 2.7s var(--soft) forwards}
      @keyframes luBarT{0%{transform:translateY(-100%)}14%{transform:translateY(0)}84%{transform:translateY(0)}100%{transform:translateY(-100%)}}
      .luBarT{animation:luBarT 2.7s var(--snap) forwards}
      @keyframes luBarB{0%{transform:translateY(100%)}14%{transform:translateY(0)}84%{transform:translateY(0)}100%{transform:translateY(100%)}}
      .luBarB{animation:luBarB 2.7s var(--snap) forwards}
      @keyframes luScrim{0%{opacity:0}10%{opacity:1}84%{opacity:1}100%{opacity:0}}
      .luScrim{animation:luScrim 2.7s var(--soft) forwards}
      @keyframes luRing{0%{transform:scale(.2);opacity:0}10%{opacity:.95}100%{transform:scale(6.5);opacity:0}}
      .luRing{animation:luRing 1.5s cubic-bezier(.1,.7,.2,1) forwards}
      @keyframes luRay{0%{transform:rotate(var(--rot)) scaleY(0);opacity:0}18%{opacity:.75}55%{transform:rotate(var(--rot)) scaleY(1);opacity:.3}100%{transform:rotate(var(--rot)) scaleY(1);opacity:0}}
      .luRay{animation:luRay 1.7s var(--soft) forwards}
      @keyframes luText{0%{transform:scale(.55) translateY(16px);opacity:0;filter:blur(10px)}
        16%{transform:scale(1.14) translateY(0);opacity:1;filter:blur(0)}
        26%{transform:scale(1)}82%{transform:scale(1);opacity:1}100%{transform:scale(1.06);opacity:0;filter:blur(4px)}}
      .luText{animation:luText 2.7s var(--snap) forwards}
      @keyframes sceneShake{0%,100%{transform:translate(0,0)}
        10%{transform:translate(-5px,3px)}22%{transform:translate(4px,-3px)}
        34%{transform:translate(-3px,-2px)}46%{transform:translate(3px,2px)}
        60%{transform:translate(-2px,1px)}76%{transform:translate(1px,-1px)}}
      .sceneShake{animation:sceneShake .72s var(--soft)}

      /* ---- volumetric god rays ---- */
      @keyframes rayDrift{0%,100%{opacity:.14;transform:translateX(0) skewX(-12deg)}50%{opacity:.3;transform:translateX(7px) skewX(-12deg)}}
      .godRay{animation:rayDrift 7s ease-in-out infinite}

      /* ---- loot reveal on the item card ---- */
      @keyframes lootPop{0%{transform:scale(1)}22%{transform:scale(1.16) rotate(-2deg)}48%{transform:scale(.97) rotate(1deg)}100%{transform:scale(1) rotate(0)}}
      .lootPop{animation:lootPop .62s var(--spring)}
      @keyframes lootBeam{0%{opacity:0;transform:scaleY(.3)}30%{opacity:.85}100%{opacity:0;transform:scaleY(1.5)}}
      .lootBeam{animation:lootBeam .8s var(--soft) forwards}

      /* ---- motion system: press / hover / focus ---- */
      .press{transition:transform .15s var(--quick)}
      .hoverLift{transition:transform .18s var(--snap), border-color .18s var(--snap), filter .18s var(--snap)}
      @media (hover:hover) and (pointer:fine){ .hoverLift:hover{transform:translateY(-2px); filter:brightness(1.06)} }
      /* touch devices keep :hover/:focus latched after a tap — never style them */
      @media (hover:none){
        .hoverLift:hover,.hoverLift:focus,.navBtn:hover,.navBtn:focus{transform:none!important;filter:none!important}
        button:focus,button:active{outline:none!important}
      }
      .navBtn{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
      .navBtn:focus{outline:none}
      .navBtn:focus-visible{outline:2px solid rgba(124,92,255,.7);outline-offset:-2px;border-radius:14px}
      .focusRing{transition:border-color .15s var(--quick), box-shadow .15s var(--quick)}
      .focusRing:focus{box-shadow:0 0 0 3px rgba(124,92,255,.28)}

      /* ---- validation shake ---- */
      @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
      .shake{animation:shake .42s var(--quick)}

      /* ---- list entrance stagger ---- */
      @keyframes rowIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
      .rowIn{animation:rowIn .38s var(--snap) both}

      /* ---- price ticker ---- */
      @keyframes tickFlash{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
      .tickFlash{animation:tickFlash .5s var(--quick)}
      @keyframes arrowBounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-3px)}60%{transform:translateY(1px)}}
      .arrowBounce{animation:arrowBounce .5s var(--spring)}

      /* ---- trade confirm ---- */
      @keyframes confirmFlash{0%{opacity:0;transform:scale(.7)}30%{opacity:1;transform:scale(1.1)}70%{opacity:1}100%{opacity:0;transform:scale(1)}}
      .confirmFlash{animation:confirmFlash .9s var(--snap) forwards}

      /* ---- boot sequence ---- */
      @keyframes bootScan{0%{top:-2px;opacity:0}10%{opacity:1}88%{opacity:1}100%{top:100%;opacity:0}}
      .bootScan{animation:bootScan .78s var(--soft) forwards}
      @keyframes bootFade{0%{opacity:0;filter:blur(4px)}45%{opacity:1;filter:blur(0)}75%{opacity:1}100%{opacity:0}}
      .bootFade{animation:bootFade .78s var(--snap) forwards}

      /* ---- the room is alive: screens, plants, steam, fans ---- */
      @keyframes tvFlicker{0%,100%{opacity:.82}12%{opacity:.62}26%{opacity:.95}41%{opacity:.7}58%{opacity:.9}73%{opacity:.66}88%{opacity:.88}}
      .tvFlicker{animation:tvFlicker 3.1s steps(1,end) infinite}
      @keyframes tvScan{0%{transform:translateY(-100%)}100%{transform:translateY(400%)}}
      .tvScan{animation:tvScan 2.6s linear infinite}
      @keyframes leafSway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
      .leafSway{animation:leafSway 4.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
      @keyframes steamRise{0%{transform:translateY(0) scale(.7);opacity:0}18%{opacity:.55}100%{transform:translateY(-22px) scale(1.5);opacity:0}}
      .steamRise{animation:steamRise 3.4s ease-out infinite}
      @keyframes fanSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
      .fanSpin{animation:fanSpin 1.5s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
      @keyframes clockTick{from{transform:rotate(0)}to{transform:rotate(360deg)}}
      .clockTick{animation:clockTick 12s steps(12,end) infinite;transform-box:fill-box;transform-origin:50% 100%}
      @keyframes fireLick{0%,100%{transform:scaleY(1) scaleX(1);opacity:.85}30%{transform:scaleY(1.22) scaleX(.92);opacity:1}62%{transform:scaleY(.92) scaleX(1.06);opacity:.78}}
      .fireLick{animation:fireLick 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}

      /* active aero: the wing settles, then trims itself on the straight */
      @keyframes wingRise{0%,58%{transform:rotate(0deg) translateY(0)}72%{transform:rotate(-9deg) translateY(-2px)}88%{transform:rotate(-9deg) translateY(-2px)}100%{transform:rotate(0deg) translateY(0)}}
      .wingRise{animation:wingRise 7s var(--soft) infinite}

      /* ---- car showroom shine ---- */
      @keyframes carShine{0%{transform:translateX(-20px) skewX(-18deg);opacity:0}12%{opacity:.55}30%{opacity:.55}45%{transform:translateX(210px) skewX(-18deg);opacity:0}100%{transform:translateX(210px) skewX(-18deg);opacity:0}}
      .carShine{animation:carShine 4.4s var(--soft) infinite}

      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    `}</style>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<Terra />);

</script>
